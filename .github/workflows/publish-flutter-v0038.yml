name: Publish Smart Life v0.3.8

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-flutter-v0038.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4

      - name: Download signed Flutter artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-b1e8-8210-a90a-d3789985defd/raw?se=2026-09-03T17%3A05%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=40d94bfd-e19c-5593-a7b0-749143eb1faa&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-03T09%3A31%3A51Z&ske=2026-09-04T09%3A31%3A51Z&sks=b&skv=2026-02-06&sig=2cEbXNh5nN8tWHj4%2BwNKZOrOyK/pDlgA1YfuJqTCOVE%3D' -o /tmp/flutter-v0038.zip
          rm -rf /tmp/flutter-v0038
          mkdir -p /tmp/flutter-v0038
          unzip -q /tmp/flutter-v0038.zip -d /tmp/flutter-v0038
          test -f /tmp/flutter-v0038/Smart-Life-Flutter-Test.apk
          cp /tmp/flutter-v0038/Smart-Life-Flutter-Test.apk Smart-Life-Flutter-Test.apk

      - name: Update Flutter feed
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.3.8",
            "versionCode": 20,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Scanner compatibility fix: the Google ML Kit scanner now uses the original native Activity launch path, Android target SDK 34/min SDK 26 to match the working native Smart Life build, and explicit Google Play services + ML Kit document_ui manifest metadata for the Flutter package."
          }
          JSON

      - name: Publish Flutter update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Smart Life Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life Flutter v0.3.8' || true
          git pull --rebase origin main
          git push origin main
