name: Publish Smart Files v0.52

on:
  push:
    paths:
      - '.github/workflows/publish-v052.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v0.52 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-8294-81f6-82cb-de9ebbf601c7/raw?se=2026-09-01T02%3A49%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=d6519b2a-8c7f-58f0-b2cb-d6db54425d7e&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T21%3A56%3A19Z&ske=2026-09-01T21%3A56%3A19Z&sks=b&skv=2026-02-06&sig=qyfvV0Rve8pJ32jk1R90nyj3IPWbTlvhu45mIArBMyE%3D' -o /tmp/v052-artifact.zip
          rm -rf /tmp/v052
          mkdir -p /tmp/v052
          unzip -q /tmp/v052-artifact.zip -d /tmp/v052
          test -f /tmp/v052/dist/Smart-Files.apk
          cp /tmp/v052/dist/Smart-Files.apk ./Smart-Files.apk
          echo 'a4922fe6953e99bf0d3e7fa4b39588aca2af236075a566ecc268c2c8fc2a0a67  Smart-Files.apk' | sha256sum -c -

      - name: Update feed
        shell: bash
        run: |
          cat > latest.json <<'JSON'
          {
            "versionName": "0.52",
            "versionCode": 54,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Files.apk",
            "releaseNotes": "Smart Files V0.52 refreshes the app theme, adds a Documents dashboard with file-type icons, counts and sizes, and adds Settings with Night Mode and About Smart Files."
          }
          JSON

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart-Files.apk latest.json
          git commit -m 'Publish Smart Files v0.52' || exit 0
          git push
