name: Publish Smart Life v0.7.3 PDF Only Staged Index

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-flutter-v0073.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify signed v0.7.3 artifact
        shell: bash
        env:
          SOURCE_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-917c-81f5-8ba4-6de8841c26fa/raw?se=2026-09-05T22%3A24%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=f9d9d770-5a29-5f89-a0be-9d9beed30c87&skoid=732f244e-db13-47c3-bcc7-7ee02a9397bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T23%3A20%3A13Z&ske=2026-09-05T23%3A20%3A13Z&sks=b&skv=2026-02-06&sig=9j%2BBfiPNUQoBPbI8W46yOZ4/%2B4EdT9iose0BJlEctB4%3D'
          EXPECTED_SHA256: 'a4ac9b039337f7a662a9c90a06c43806ce97710ea8297cf6ada4cb437e283c1a'
        run: |
          set -euo pipefail
          rm -rf incoming-v073
          mkdir incoming-v073
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o incoming-v073/artifact.zip
          unzip -q incoming-v073/artifact.zip -d incoming-v073/unpacked
          APK="$(find incoming-v073/unpacked -type f -name 'Smart-Life-v0.7.3-PDF-Staged-Index.apk' -print -quit)"
          test -n "$APK"
          ACTUAL_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "APK SHA256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          cp "$APK" Smart-Life-Flutter-Test.apk

      - name: Write v0.7.3 update metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.7.3",
            "versionCode": 6055,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Smart Search is temporarily narrowed to PDF only so the large image library cannot interfere with indexing. PDF indexing now runs in two stages: Stage 1 reads searchable PDF text without OCR in batches of 10; Stage 2 OCRs only scanned/image PDFs one at a time to reduce memory pressure. Progress is persisted and shown as Indexed X of Y PDFs. The content index is rebuilt cleanly for this PDF-only phase, and images are intentionally not indexed while PDF indexing is validated. Existing Smart Search Index Settings, Resume/Rebuild controls, voice search and opening motion are preserved."
          }
          JSON

      - name: Publish to Smart Life update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.7.3 (6055)'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify published metadata and APK hash
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"versionName": "0.7.3"' flutter-latest.json
          grep -q '"versionCode": 6055' flutter-latest.json
          test "$(sha256sum Smart-Life-Flutter-Test.apk | awk '{print $1}')" = 'a4ac9b039337f7a662a9c90a06c43806ce97710ea8297cf6ada4cb437e283c1a'
          PUBLISHED_COMMIT="$(git rev-parse HEAD)"
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/flutter-latest.json" -o /tmp/published-latest.json
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/Smart-Life-Flutter-Test.apk" -o /tmp/published.apk
          grep -q '"versionName": "0.7.3"' /tmp/published-latest.json
          grep -q '"versionCode": 6055' /tmp/published-latest.json
          test "$(sha256sum /tmp/published.apk | awk '{print $1}')" = 'a4ac9b039337f7a662a9c90a06c43806ce97710ea8297cf6ada4cb437e283c1a'
          echo 'Smart Life v0.7.3 update channel verified remotely.'
