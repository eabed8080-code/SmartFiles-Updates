name: Publish Smart Files v0.51

on:
  push:
    paths:
      - '.github/workflows/publish-v051.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v0.51 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-b838-81f7-9947-1540341ec5e6/raw?se=2026-09-01T01%3A35%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=4c456f85-a828-58e0-a959-43271f31dfa3&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T21%3A53%3A17Z&ske=2026-09-01T21%3A53%3A17Z&sks=b&skv=2026-02-06&sig=qQP2k%2BY1K3VsmUyejVTK/fDUbvuY6eGQFCIxdDmnYdo%3D' -o /tmp/v051-artifact.zip
          rm -rf /tmp/v051
          mkdir -p /tmp/v051
          unzip -q /tmp/v051-artifact.zip -d /tmp/v051
          test -f /tmp/v051/dist/Smart-Files.apk
          cp /tmp/v051/dist/Smart-Files.apk ./Smart-Files.apk
          sha256sum ./Smart-Files.apk

      - name: Update feed
        shell: bash
        run: |
          cat > latest.json <<'JSON'
          {
            "versionName": "0.51",
            "versionCode": 53,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Files.apk",
            "releaseNotes": "Smart Files V0.51 adds 50-result search pages with Previous/Next, Stop Search and auto-cancel, removes the duplicate file-type chip, keeps PowerPoint fully visible, and upgrades the mascot to a lightweight human 2D character."
          }
          JSON

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart-Files.apk latest.json
          git commit -m 'Publish Smart Files v0.51' || exit 0
          git push
