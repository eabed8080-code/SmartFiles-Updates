name: Publish Smart Life v0.10.0 Arabic Search Hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-flutter-v0100-arabic-search-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify signed v0.10.0 artifact
        shell: bash
        env:
          SOURCE_URL: 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-22c4-81f7-8377-79d8f9d4a1d0/raw?se=2026-09-08T22%3A56%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=56e06132-0dc1-5315-9aea-430c9e5ab06e&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-08T19%3A27%3A18Z&ske=2026-09-09T19%3A27%3A18Z&sks=b&skv=2026-02-06&sig=tJHQpscWgdLxLrZDeY9O2yNodmw91%2B6oz931HLG1E1M%3D'
          EXPECTED_SHA256: 'bcec03309253705d2a2fa7d11e71634329d1d8fc3d7c82c224be4dc0cc3a7531'
        run: |
          set -euo pipefail
          rm -rf incoming-v0100
          mkdir incoming-v0100
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o incoming-v0100/artifact.zip
          unzip -q incoming-v0100/artifact.zip -d incoming-v0100/unpacked
          APK="$(find incoming-v0100/unpacked -type f -name 'Smart-Life-v0.10.0-Arabic-Search-Hardening.apk' -print -quit)"
          test -n "$APK"
          ACTUAL_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "APK SHA256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          SIZE="$(stat -c %s "$APK")"
          echo "APK bytes: $SIZE"
          test "$SIZE" = '91891303'
          cp "$APK" Smart-Life-Flutter-Test.apk

      - name: Verify APK identity and OCR payload
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          CERT="$($TOOLS/apksigner verify --verbose --print-certs Smart-Life-Flutter-Test.apk)"
          printf '%s' "$CERT" | tr '[:upper:]' '[:lower:]' | tr -d ': ' | grep -q 'fba1a652ac3ed950b45ea26585cccbeb8497153f137f761d17ea12cae71c955b'
          BADGING="$("$TOOLS/aapt" dump badging Smart-Life-Flutter-Test.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionName='0.10.0'"
          echo "$BADGING" | grep -q "versionCode='10082'"
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'assets/easyocr/easyocr_arabic_charset.txt'
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'assets/models/rec/inference.onnx'
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'assets/models/det/inference.onnx'
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'lib/arm64-v8a/libonnxruntime.so'
          if unzip -l Smart-Life-Flutter-Test.apk | grep -q 'easyocr_arabic_rec_mobile.onnx'; then echo 'EasyOCR large model must download separately'; exit 1; fi
          if unzip -l Smart-Life-Flutter-Test.apk | grep -q 'lib/arm64-v8a/libtesseract.so'; then echo 'Tesseract payload unexpectedly present'; exit 1; fi
          if unzip -l Smart-Life-Flutter-Test.apk | grep -q 'assets/tessdata/'; then echo 'Tessdata unexpectedly present'; exit 1; fi

      - name: Write v0.10.0 update metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.10.0",
            "versionCode": 10082,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Arabic Search Hardening: PP-OCRv5 Arabic is now the primary on-device OCR path with more tolerant text detection for faint Arabic scans. EasyOCR remains a best-effort fallback and can no longer suppress valid Paddle output if its model or decode fails. Raw OCR plus safe RTL variants are preserved, Arabic search adds Unicode NFKC/zero-width normalization and bounded fuzzy matching for small OCR mistakes, and arabic_repair_v5 retries prior Arabic repair attempts lazily without clearing the completed Smart Search index."
          }
          JSON

      - name: Publish update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.10.0 (10082) Arabic search hardening'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify published update remotely
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED_COMMIT="$(git rev-parse HEAD)"
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/flutter-latest.json" -o /tmp/published-latest.json
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/Smart-Life-Flutter-Test.apk" -o /tmp/published.apk
          grep -q '"versionName": "0.10.0"' /tmp/published-latest.json
          grep -q '"versionCode": 10082' /tmp/published-latest.json
          test "$(sha256sum /tmp/published.apk | awk '{print $1}')" = 'bcec03309253705d2a2fa7d11e71634329d1d8fc3d7c82c224be4dc0cc3a7531'
          echo 'Smart Life v0.10.0 update channel verified remotely.'
