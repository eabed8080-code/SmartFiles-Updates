name: Publish Smart Life v0.8.5 Pending PC

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-flutter-v0085-pending-pc.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify signed v0.8.5 artifact
        shell: bash
        env:
          SOURCE_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-e314-81f5-908d-b9c43a76e778/raw?se=2026-09-07T03%3A11%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=29ec9c9a-a382-5be7-8ae3-325117ab9ad4&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T12%3A27%3A41Z&ske=2026-09-07T12%3A27%3A41Z&sks=b&skv=2026-02-06&sig=S/IpgqHoMlgx5y1qeTmFhkPmdSdmT0UXBZ5VQsHXclY%3D'
          EXPECTED_SHA256: 'bcd51d364c06b26c337a205d109e2588d93ce75a36521f0d375193acb4dbfd3c'
        run: |
          set -euo pipefail
          rm -rf incoming-v085
          mkdir incoming-v085
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o incoming-v085/artifact.zip
          unzip -q incoming-v085/artifact.zip -d incoming-v085/unpacked
          APK="$(find incoming-v085/unpacked -type f -name 'Smart-Life-v0.8.5-Pending-PC.apk' -print -quit)"
          test -n "$APK"
          ACTUAL_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "APK SHA256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          cp "$APK" Smart-Life-Flutter-Test.apk

      - name: Verify APK identity before publish
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          CERT="$($TOOLS/apksigner verify --verbose --print-certs Smart-Life-Flutter-Test.apk)"
          echo "$CERT"
          printf '%s' "$CERT" | tr '[:upper:]' '[:lower:]' | tr -d ': ' | grep -q 'fba1a652ac3ed950b45ea26585cccbeb8497153f137f761d17ea12cae71c955b'
          BADGING="$("$TOOLS/aapt" dump badging Smart-Life-Flutter-Test.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionName='0.8.5'"
          echo "$BADGING" | grep -q "versionCode='10067'"

      - name: Write v0.8.5 update metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.8.5",
            "versionCode": 10067,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Phone to PC Pending queue. Android Share first saves a persistent local copy on the phone. If the PC is available, the file sends immediately and the local Pending copy is removed only after confirmed upload. If the PC is off or unreachable, the file stays safely in Pending and Android JobScheduler retries in the background. MainActivity/startup remains unchanged. Text-only share links now explain to choose Send a copy."
          }
          JSON

      - name: Publish to Smart Life update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.8.5 (10067) Pending PC queue'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify published metadata and APK remotely
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED_COMMIT="$(git rev-parse HEAD)"
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/flutter-latest.json" -o /tmp/published-latest.json
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/Smart-Life-Flutter-Test.apk" -o /tmp/published.apk
          grep -q '"versionName": "0.8.5"' /tmp/published-latest.json
          grep -q '"versionCode": 10067' /tmp/published-latest.json
          test "$(sha256sum /tmp/published.apk | awk '{print $1}')" = 'bcd51d364c06b26c337a205d109e2588d93ce75a36521f0d375193acb4dbfd3c'
          echo 'Smart Life v0.8.5 update channel verified remotely.'
