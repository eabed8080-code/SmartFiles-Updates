name: Publish Smart Life v0.8.2 Safe Direct Share

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-flutter-v0082-safe-share.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify signed v0.8.2 artifact
        shell: bash
        env:
          SOURCE_URL: 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-4c64-81f7-ae11-cf481aa9dccd/raw?se=2026-09-07T01%3A45%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=e40dbe9c-a061-5958-9d93-3fab03184289&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T21%3A24%3A19Z&ske=2026-09-07T21%3A24%3A19Z&sks=b&skv=2026-02-06&sig=4UbXC6mlzLXtbSRgXk5pPVzDCvR/0kfhFObt/JjIoUY%3D'
          EXPECTED_SHA256: '966ec58455d08fb4bb7b9cdae5b9b2edd2246b4e89566ca3f07da33d58929cc5'
        run: |
          set -euo pipefail
          rm -rf incoming-v082
          mkdir incoming-v082
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o incoming-v082/artifact.zip
          unzip -q incoming-v082/artifact.zip -d incoming-v082/unpacked
          APK="$(find incoming-v082/unpacked -type f -name 'Smart-Life-v0.8.2-Direct-Share.apk' -print -quit)"
          test -n "$APK"
          ACTUAL_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "APK SHA256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          cp "$APK" Smart-Life-Flutter-Test.apk

      - name: Verify APK identity before publish
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          CERT="$($TOOLS/apksigner verify --verbose --print-certs Smart-Life-Flutter-Test.apk)"
          echo "$CERT"
          printf '%s' "$CERT" | tr '[:upper:]' '[:lower:]' | tr -d ': ' | grep -q 'fba1a652ac3ed950b45ea26585cccbeb8497153f137f761d17ea12cae71c955b'
          BADGING="$("$TOOLS/aapt" dump badging Smart-Life-Flutter-Test.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionName='0.8.2'"
          echo "$BADGING" | grep -q "versionCode='10064'"

      - name: Write v0.8.2 update metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.8.2",
            "versionCode": 10064,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Safe direct Android Share to PC. Smart Life now appears as an Android share target for any file type. Startup/MainActivity and the existing PC sender implementation are unchanged from the known-good runtime. Pending retry is intentionally not included in this phase."
          }
          JSON

      - name: Publish to Smart Life update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.8.2 (10064) safe direct share'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify published metadata and APK remotely
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED_COMMIT="$(git rev-parse HEAD)"
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/flutter-latest.json" -o /tmp/published-latest.json
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/Smart-Life-Flutter-Test.apk" -o /tmp/published.apk
          grep -q '"versionName": "0.8.2"' /tmp/published-latest.json
          grep -q '"versionCode": 10064' /tmp/published-latest.json
          test "$(sha256sum /tmp/published.apk | awk '{print $1}')" = '966ec58455d08fb4bb7b9cdae5b9b2edd2246b4e89566ca3f07da33d58929cc5'
          echo 'Smart Life v0.8.2 update channel verified remotely.'
