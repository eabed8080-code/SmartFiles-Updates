name: Publish Smart Life v0.9.0 Smart Search Bridge Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-flutter-v0090-smart-search-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify signed v0.9.0 artifact
        shell: bash
        env:
          SOURCE_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-36d4-81fd-9543-f6634889c67a/raw?se=2026-09-07T19%3A18%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=a4bf63e0-3801-5621-8a2f-945176113df1&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-07T12%3A28%3A10Z&ske=2026-09-08T12%3A28%3A10Z&sks=b&skv=2026-02-06&sig=bL8DQRDlKfvrwelqIIuwl4pPCzb8yS6qI4eVVZeHxqs%3D'
          EXPECTED_SHA256: '9ed5547e83c9778f6cc2a488076570431f31090256c7bdbbb0b78eba49860b02'
        run: |
          set -euo pipefail
          rm -rf incoming-v090
          mkdir incoming-v090
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o incoming-v090/artifact.zip
          unzip -q incoming-v090/artifact.zip -d incoming-v090/unpacked
          APK="$(find incoming-v090/unpacked -type f -name 'Smart-Life-v0.9.0-Smart-Search-Bridge-Recovery.apk' -print -quit)"
          test -n "$APK"
          ACTUAL_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "APK SHA256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          cp "$APK" Smart-Life-Flutter-Test.apk

      - name: Verify APK identity before publish
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          CERT="$($TOOLS/apksigner verify --verbose --print-certs Smart-Life-Flutter-Test.apk)"
          printf '%s' "$CERT" | tr '[:upper:]' '[:lower:]' | tr -d ': ' | grep -q 'fba1a652ac3ed950b45ea26585cccbeb8497153f137f761d17ea12cae71c955b'
          BADGING="$("$TOOLS/aapt" dump badging Smart-Life-Flutter-Test.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionName='0.9.0'"
          echo "$BADGING" | grep -q "versionCode='10072'"

      - name: Write v0.9.0 update metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.9.0",
            "versionCode": 10072,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Fixes Smart Search staying at 0/N by restoring the missing native Smart Search status and clear bridge after the staged-index rewrites. Local Arabic and English PaddleOCR remains fully on-device, PDFs are processed first, and progress no longer rescans the entire phone inventory after every small batch. Existing Search by Name, Search Content, Connect to PC, Transfer Status, reminders, sound dropdowns, and previous Smart Life behavior are preserved."
          }
          JSON

      - name: Publish to Smart Life update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.9.0 (10072) Smart Search Bridge Recovery'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify published metadata and APK remotely
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED_COMMIT="$(git rev-parse HEAD)"
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/flutter-latest.json" -o /tmp/published-latest.json
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/Smart-Life-Flutter-Test.apk" -o /tmp/published.apk
          grep -q '"versionName": "0.9.0"' /tmp/published-latest.json
          grep -q '"versionCode": 10072' /tmp/published-latest.json
          test "$(sha256sum /tmp/published.apk | awk '{print $1}')" = '9ed5547e83c9778f6cc2a488076570431f31090256c7bdbbb0b78eba49860b02'
          echo 'Smart Life v0.9.0 update channel verified remotely.'
