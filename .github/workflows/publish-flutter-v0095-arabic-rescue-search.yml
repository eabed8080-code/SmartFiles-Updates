name: Publish Smart Life v0.9.5 Arabic Rescue Search

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-flutter-v0095-arabic-rescue-search.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify signed v0.9.5 artifact
        shell: bash
        env:
          SOURCE_URL: 'https://sdmntprwestus.oaiusercontent.com/files/00000000-723c-8230-a067-860f0c28a23e/raw?se=2026-09-08T16%3A54%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=bba229c0-5d51-5572-941c-880747868b14&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-08T14%3A00%3A20Z&ske=2026-09-09T14%3A00%3A20Z&sks=b&skv=2026-02-06&sig=i/YWmvRnhwSH6PpHnXYWZMz9GGwbwSJXUo7DttE64oc%3D'
          EXPECTED_SHA256: 'eef5dd52de24e7ee256c2d7466f38d804e5d99f3f076054d8b514bbe98acf4f6'
        run: |
          set -euo pipefail
          rm -rf incoming-v095
          mkdir incoming-v095
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o incoming-v095/artifact.zip
          unzip -q incoming-v095/artifact.zip -d incoming-v095/unpacked
          APK="$(find incoming-v095/unpacked -type f -name 'Smart-Life-v0.9.5-Arabic-Rescue-Search.apk' -print -quit)"
          test -n "$APK"
          ACTUAL_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "APK SHA256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          cp "$APK" Smart-Life-Flutter-Test.apk

      - name: Verify APK identity before publish
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          CERT="$($TOOLS/apksigner verify --verbose --print-certs Smart-Life-Flutter-Test.apk)"
          printf '%s' "$CERT" | tr '[:upper:]' '[:lower:]' | tr -d ': ' | grep -q 'fba1a652ac3ed950b45ea26585cccbeb8497153f137f761d17ea12cae71c955b'
          BADGING="$("$TOOLS/aapt" dump badging Smart-Life-Flutter-Test.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionName='0.9.5'"
          echo "$BADGING" | grep -q "versionCode='10077'"

      - name: Write v0.9.5 update metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.9.5",
            "versionCode": 10077,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Arabic Rescue Search keeps the completed Smart Search index and never starts a full rebuild automatically. When an Arabic Search Content query has no saved match, Smart Life checks only likely OCR-dependent files: scanned PDFs first, then document-like images with existing OCR text or high-probability document paths. The corrected PaddleOCR Arabic model runs on a small bounded batch, fresh OCR text is merged into the existing SQLite row so English and numbers are preserved, and separate path/mtime/size repair checkpoints ensure the same files are not repeated. A search attempt repairs at most 24 visual files and stops early when matches are found; if needed, repeating the same Arabic search continues from saved repair progress. Existing Turbo Deep OCR checkpoints, Search by Name, English/number search, Pause/Resume, Connect to PC, Transfer Status, reminders, sounds, and all previous Smart Life behavior are preserved."
          }
          JSON

      - name: Publish to Smart Life update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.9.5 (10077) Arabic Rescue Search'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify published metadata and APK remotely
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED_COMMIT="$(git rev-parse HEAD)"
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/flutter-latest.json" -o /tmp/published-latest.json
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/Smart-Life-Flutter-Test.apk" -o /tmp/published.apk
          grep -q '"versionName": "0.9.5"' /tmp/published-latest.json
          grep -q '"versionCode": 10077' /tmp/published-latest.json
          test "$(sha256sum /tmp/published.apk | awk '{print $1}')" = 'eef5dd52de24e7ee256c2d7466f38d804e5d99f3f076054d8b514bbe98acf4f6'
          echo 'Smart Life v0.9.5 update channel verified remotely.'
