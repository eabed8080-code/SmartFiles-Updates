name: Publish Smart Files v0.48

on:
  push:
    paths:
      - ".github/workflows/publish-v048.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4

      - name: Download verified v0.48 APK artifact
        shell: bash
        run: |
          set -euo pipefail
          echo "Publishing Smart Files v0.48 (50)"
          curl --fail --location --retry 3 \
            'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-5570-81f7-b943-d31adbeb84b1/raw?se=2026-08-31T23%3A54%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=e266b15a-9c0f-55b5-8ced-bac1067b7c49&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T21%3A50%3A23Z&ske=2026-09-01T21%3A50%3A23Z&sks=b&skv=2026-02-06&sig=MnPPbeeELqqXd61CmRrjgSmPY380%2BfHwOWVF8Dms5bk%3D' \
            --output /tmp/v048.zip
          rm -rf /tmp/v048
          mkdir -p /tmp/v048
          unzip -q /tmp/v048.zip -d /tmp/v048
          test -f /tmp/v048/Smart-Files.apk
          echo '7c688752f88f20f9550be80905b4bda284c01be12e75aa1c82bac98120bb2eb8  /tmp/v048/Smart-Files.apk' | sha256sum -c -
          cp /tmp/v048/Smart-Files.apk ./Smart-Files.apk

      - name: Publish update feed
        shell: bash
        run: |
          cat > latest.json <<'JSON'
          {
            "versionName": "0.48",
            "versionCode": 50,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Files.apk",
            "releaseNotes": "Smart Files V0.48 fixes the PowerPoint file-type button so its label stays on one line."
          }
          JSON

          git config user.name "Smart Files Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Smart-Files.apk latest.json
          if git diff --cached --quiet; then
            echo "Update channel already matches v0.48."
            exit 0
          fi
          git commit -m "Publish Smart Files v0.48 (50)"
          git push
