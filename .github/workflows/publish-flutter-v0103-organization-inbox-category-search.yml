name: Publish Smart Life v0.10.3 Organization Inbox & Category Search

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-flutter-v0103-organization-inbox-category-search.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify signed v0.10.3 artifact
        shell: bash
        env:
          SOURCE_URL: 'https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-2a70-820c-b18b-72be1625f239/raw?se=2026-09-09T06%3A45%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=4b1d80ad-c58f-52e0-a3b4-7bbb72dfdffa&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-09T01%3A45%3A16Z&ske=2026-09-10T01%3A45%3A16Z&sks=b&skv=2026-02-06&sig=vKoAIc2OAeOzYGYCghnGFqx5AMZVSPENf9dceSL6xAo%3D'
          EXPECTED_SHA256: '184f8cf7d0e85a1f58914f8c45b1c044b9ad646f5f1d15d75b45c5ad1145887c'
          EXPECTED_SIZE: '91956839'
        run: |
          set -euo pipefail
          rm -rf incoming-v0103
          mkdir incoming-v0103
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o incoming-v0103/artifact.zip
          unzip -q incoming-v0103/artifact.zip -d incoming-v0103/unpacked
          APK="$(find incoming-v0103/unpacked -type f -name 'Smart-Life-v0.10.3-Organization-Inbox-Category-Search.apk' -print -quit)"
          test -n "$APK"
          ACTUAL_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "APK SHA256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          SIZE="$(stat -c %s "$APK")"
          echo "APK bytes: $SIZE"
          test "$SIZE" = "$EXPECTED_SIZE"
          cp "$APK" Smart-Life-Flutter-Test.apk

      - name: Verify APK identity and OCR payload
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          CERT="$($TOOLS/apksigner verify --verbose --print-certs Smart-Life-Flutter-Test.apk)"
          printf '%s' "$CERT" | tr '[:upper:]' '[:lower:]' | tr -d ': ' | grep -q 'fba1a652ac3ed950b45ea26585cccbeb8497153f137f761d17ea12cae71c955b'
          BADGING="$("$TOOLS/aapt" dump badging Smart-Life-Flutter-Test.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionName='0.10.3'"
          echo "$BADGING" | grep -q "versionCode='10085'"
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'assets/easyocr/easyocr_arabic_charset.txt'
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'assets/models/rec/inference.onnx'
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'assets/models/det/inference.onnx'
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'lib/arm64-v8a/libonnxruntime.so'

      - name: Write v0.10.3 update metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.10.3",
            "versionCode": 10085,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Main Find now acts as the organization inbox: once a file is assigned to a Category it disappears from Find and remains available from its Category. Each Category now has its own file-name search field for quickly locating files inside large categories. Settings > Sounds & Effects is collapsed by default and expands only when tapped. Existing batch category actions, sound choices, Arabic OCR, and search stack are preserved."
          }
          JSON

      - name: Publish update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.10.3 (10085) organization inbox category search'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify published update remotely
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED_COMMIT="$(git rev-parse HEAD)"
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/flutter-latest.json" -o /tmp/published-latest.json
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/Smart-Life-Flutter-Test.apk" -o /tmp/published.apk
          grep -q '"versionName": "0.10.3"' /tmp/published-latest.json
          grep -q '"versionCode": 10085' /tmp/published-latest.json
          test "$(sha256sum /tmp/published.apk | awk '{print $1}')" = '184f8cf7d0e85a1f58914f8c45b1c044b9ad646f5f1d15d75b45c5ad1145887c'
          echo 'Smart Life v0.10.3 update channel verified remotely.'
