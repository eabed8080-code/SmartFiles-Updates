name: Publish Smart Life v0.8.3 Share URI Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-flutter-v0083-share-uri-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify signed v0.8.3 artifact
        shell: bash
        env:
          SOURCE_URL: 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-6bf4-81f7-9b7d-d97e229de4db/raw?se=2026-09-07T02%3A18%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=bbf9f8af-3d44-5a12-b4de-fed89d1a37b4&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T21%3A21%3A23Z&ske=2026-09-07T21%3A21%3A23Z&sks=b&skv=2026-02-06&sig=2zZO0tENpLsbbRECk%2Bawv0OLufeFuVgP8rWqLUcX7m4%3D'
          EXPECTED_SHA256: '6ff9816532f950d63d52bcbc3c44215b5dd43454040f4989696ef0466e9ac82a'
        run: |
          set -euo pipefail
          rm -rf incoming-v083
          mkdir incoming-v083
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o incoming-v083/artifact.zip
          unzip -q incoming-v083/artifact.zip -d incoming-v083/unpacked
          APK="$(find incoming-v083/unpacked -type f -name 'Smart-Life-v0.8.3-Share-URI-Fix.apk' -print -quit)"
          test -n "$APK"
          ACTUAL_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "APK SHA256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          cp "$APK" Smart-Life-Flutter-Test.apk

      - name: Verify APK identity before publish
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          CERT="$($TOOLS/apksigner verify --verbose --print-certs Smart-Life-Flutter-Test.apk)"
          echo "$CERT"
          printf '%s' "$CERT" | tr '[:upper:]' '[:lower:]' | tr -d ': ' | grep -q 'fba1a652ac3ed950b45ea26585cccbeb8497153f137f761d17ea12cae71c955b'
          BADGING="$("$TOOLS/aapt" dump badging Smart-Life-Flutter-Test.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionName='0.8.3'"
          echo "$BADGING" | grep -q "versionCode='10065'"

      - name: Write v0.8.3 update metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.8.3",
            "versionCode": 10065,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Android Share compatibility fix for WhatsApp and document/PDF viewers. Smart Life now accepts shared file URIs from EXTRA_STREAM, ClipData, and intent.data. Startup/MainActivity is unchanged, and no Pending retry logic is added in this phase."
          }
          JSON

      - name: Publish to Smart Life update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.8.3 (10065) share URI fix'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify published metadata and APK remotely
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED_COMMIT="$(git rev-parse HEAD)"
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/flutter-latest.json" -o /tmp/published-latest.json
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/Smart-Life-Flutter-Test.apk" -o /tmp/published.apk
          grep -q '"versionName": "0.8.3"' /tmp/published-latest.json
          grep -q '"versionCode": 10065' /tmp/published-latest.json
          test "$(sha256sum /tmp/published.apk | awk '{print $1}')" = '6ff9816532f950d63d52bcbc3c44215b5dd43454040f4989696ef0466e9ac82a'
          echo 'Smart Life v0.8.3 update channel verified remotely.'
