name: Publish Smart Life v0.6.0 Voice Language

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0053-cleanup-preview-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download signed Smart Life v0.6.0 APK artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-3ab8-81f5-a868-b917e7c81875/raw?se=2026-09-05T02%3A36%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=5bc3973c-2778-55db-ab13-79f2a25b55d6&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T23%3A17%3A51Z&ske=2026-09-05T23%3A17%3A51Z&sks=b&skv=2026-02-06&sig=Bpchl49uF/08B7eNdhbuzRNbYne9IXYf6L43%2BW4Mnlk%3D' -o /tmp/smart-life-v0060.zip
          test "$(sha256sum /tmp/smart-life-v0060.zip | awk '{print $1}')" = '7f30db9f4b0b14def3da97c3b74ecf79e35c9a0ea237d14f55003bbaf734ecd1'
          rm -rf /tmp/smart-life-v0060
          mkdir -p /tmp/smart-life-v0060
          unzip -q /tmp/smart-life-v0060.zip -d /tmp/smart-life-v0060
          test -f /tmp/smart-life-v0060/Smart-Life-Flutter-Test.apk
          cp /tmp/smart-life-v0060/Smart-Life-Flutter-Test.apk Smart-Life-Flutter-Test.apk
          test "$(stat -c%s Smart-Life-Flutter-Test.apk)" -gt 1000000

      - name: Verify signed release metadata
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$TOOLS/apksigner" verify --verbose Smart-Life-Flutter-Test.apk
          BADGING="$("$TOOLS/aapt" dump badging Smart-Life-Flutter-Test.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionCode='6042'"
          echo "$BADGING" | grep -q "versionName='0.6.0'"
          test "$(sha256sum Smart-Life-Flutter-Test.apk | awk '{print $1}')" = 'c3e6651fc15ecc859f72e7c75795fbf8195fa77ca49f0c806fb2501f49bb0235'
          sha256sum Smart-Life-Flutter-Test.apk
          ls -lh Smart-Life-Flutter-Test.apk

      - name: Update Smart Life feed
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.6.0",
            "versionCode": 6042,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Today voice reminders now let you choose العربية or English before recording. Smart Life remembers your last language choice and sends that language directly to Android speech recognition so Arabic is no longer interpreted as English. Existing Today, Life Inbox, date parsing and reminder notifications stay unchanged."
          }
          JSON

      - name: Publish updater APK and feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Smart Life Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.6.0 build 6042' || true
          git pull --rebase origin main
          git push origin main
