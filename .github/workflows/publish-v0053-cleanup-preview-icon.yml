name: Publish Smart Life v0.6.4 Update Refresh

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0053-cleanup-preview-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download signed Smart Life v0.6.4 APK artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-7410-820c-99b7-4bdb9cd7f704/raw?se=2026-09-05T06%3A35%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=f8f6f3f6-0091-5b92-ae46-3981c53261c7&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T23%3A26%3A19Z&ske=2026-09-05T23%3A26%3A19Z&sks=b&skv=2026-02-06&sig=LKHU3gj3YRyqlwVIS%2BXEmWkh7lj6rI2SzT08bCEuYZM%3D' -o /tmp/smart-life-v0064.zip
          test "$(sha256sum /tmp/smart-life-v0064.zip | awk '{print $1}')" = '1367b5481fd25fa86317d82b7558e00e16fe5693902735785887ec383813eed4'
          rm -rf /tmp/smart-life-v0064
          mkdir -p /tmp/smart-life-v0064
          unzip -q /tmp/smart-life-v0064.zip -d /tmp/smart-life-v0064
          test -f /tmp/smart-life-v0064/Smart-Life-v0.6.4-Update-Refresh.apk
          cp /tmp/smart-life-v0064/Smart-Life-v0.6.4-Update-Refresh.apk Smart-Life-Flutter-Test.apk
          test "$(stat -c%s Smart-Life-Flutter-Test.apk)" -gt 1000000

      - name: Verify signed Android release metadata
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$TOOLS/apksigner" verify --verbose Smart-Life-Flutter-Test.apk
          BADGING="$("$TOOLS/aapt" dump badging Smart-Life-Flutter-Test.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionCode='6046'"
          echo "$BADGING" | grep -q "versionName='0.6.4'"
          test "$(sha256sum Smart-Life-Flutter-Test.apk | awk '{print $1}')" = '6b25321502a5d202b8a29e91fc0162fd01ba454e019ac0c63aab041444cea55f'
          sha256sum Smart-Life-Flutter-Test.apk
          ls -lh Smart-Life-Flutter-Test.apk

      - name: Keep Smart Life PC Receiver setup
        shell: bash
        run: |
          set -euo pipefail
          test -f Smart-Life-PC-Receiver-Setup.exe
          test "$(stat -c%s Smart-Life-PC-Receiver-Setup.exe)" -gt 1000000

      - name: Update Smart Life feed
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.6.4",
            "versionCode": 6046,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Update refresh fix. Check for Update and APK downloads now bypass GitHub/CDN cache so Smart Life always sees the newest published version. Based on the stable v0.6.3 runtime; Quick Transfer phone changes remain disabled."
          }
          JSON

      - name: Publish Smart Life v0.6.4 update refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Smart Life Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.6.4 build 6046 update refresh' || true
          git pull --rebase origin main
          git push origin main
