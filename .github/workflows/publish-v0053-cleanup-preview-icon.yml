name: Publish Smart Life v0.5.9 Today

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0053-cleanup-preview-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download signed Smart Life v0.5.9 APK artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-ccdc-81f5-96bc-821a179c4ea1/raw?se=2026-09-05T00%3A41%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=5faa0fcf-13e4-59fb-841d-1f2f39169a4e&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T23%3A12%3A47Z&ske=2026-09-05T23%3A12%3A47Z&sks=b&skv=2026-02-06&sig=WHxzJp7pmWQXlOxywEtuE7l4MxrwOZHLy40a1emQyR0%3D' -o /tmp/smart-life-v0059.zip
          test "$(sha256sum /tmp/smart-life-v0059.zip | awk '{print $1}')" = 'b63ecfb1e6d17d3030d9a551685c64e35658d679d664601497e3eea4ec7596c4'
          rm -rf /tmp/smart-life-v0059
          mkdir -p /tmp/smart-life-v0059
          unzip -q /tmp/smart-life-v0059.zip -d /tmp/smart-life-v0059
          test -f /tmp/smart-life-v0059/Smart-Life-Flutter-Test.apk
          cp /tmp/smart-life-v0059/Smart-Life-Flutter-Test.apk Smart-Life-Flutter-Test.apk
          test "$(stat -c%s Smart-Life-Flutter-Test.apk)" -gt 1000000

      - name: Verify signed release metadata
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$TOOLS/apksigner" verify --verbose Smart-Life-Flutter-Test.apk
          BADGING="$("$TOOLS/aapt" dump badging Smart-Life-Flutter-Test.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionCode='6041'"
          echo "$BADGING" | grep -q "versionName='0.5.9'"
          test "$(sha256sum Smart-Life-Flutter-Test.apk | awk '{print $1}')" = '8381dae7740d83c3c0176357bce878f7eaa70d35e0de9406edb9a6729f694606'
          sha256sum Smart-Life-Flutter-Test.apk
          ls -lh Smart-Life-Flutter-Test.apk

      - name: Update Smart Life feed
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.5.9",
            "versionCode": 6041,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Today adds a Home reminder card with Life Inbox, Today and Upcoming tasks. Add reminders by typing or voice, understand common Arabic and English dates such as tomorrow, after two weeks, next weekdays and numeric dates, optionally schedule Android notifications for a chosen time, and keep reminders after reboot. File Options also removes the unnecessary Details action."
          }
          JSON

      - name: Publish updater APK and feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Smart Life Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.5.9 build 6041' || true
          git pull --rebase origin main
          git push origin main
