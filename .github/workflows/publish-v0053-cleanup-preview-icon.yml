name: Publish Smart Life v0.5.4 Smart Converter

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0053-cleanup-preview-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download signed Smart Life v0.5.4 APK artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-e3b4-81f7-98a9-7b6a4542c11f/raw?se=2026-09-04T20%3A02%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=d70c6f04-22d2-5b80-8422-47003f3b3759&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T01%3A41%3A13Z&ske=2026-09-05T01%3A41%3A13Z&sks=b&skv=2026-02-06&sig=lIy0MWm6YuzNS5PGC9UjV/9e4VeYsIbANnsAJgRnj2E%3D' -o /tmp/smart-life-v0054.zip
          test "$(sha256sum /tmp/smart-life-v0054.zip | awk '{print $1}')" = 'e5ca6754e2243e4b3bcfdce5a90581adbc03244e8c5d93914e57a382686c5d00'
          rm -rf /tmp/smart-life-v0054
          mkdir -p /tmp/smart-life-v0054
          unzip -q /tmp/smart-life-v0054.zip -d /tmp/smart-life-v0054
          test -f /tmp/smart-life-v0054/Smart-Life-Flutter-Test.apk
          cp /tmp/smart-life-v0054/Smart-Life-Flutter-Test.apk Smart-Life-Flutter-Test.apk
          test "$(stat -c%s Smart-Life-Flutter-Test.apk)" -gt 1000000

      - name: Verify signed release metadata
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$TOOLS/apksigner" verify --verbose Smart-Life-Flutter-Test.apk
          BADGING="$("$TOOLS/aapt" dump badging Smart-Life-Flutter-Test.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionCode='6036'"
          echo "$BADGING" | grep -q "versionName='0.5.4'"
          sha256sum Smart-Life-Flutter-Test.apk
          ls -lh Smart-Life-Flutter-Test.apk

      - name: Update Smart Life feed
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.5.4",
            "versionCode": 6036,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Converter rebuilt with Smart Convert, organized Documents and Media sections, and the existing Quick Converters kept in place. Adds local file conversions including Office to PDF, PDF to Word, Images to PDF, PDF to Images, and Video to Audio."
          }
          JSON

      - name: Publish updater APK and feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Smart Life Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.5.4 build 6036' || true
          git pull --rebase origin main
          git push origin main
