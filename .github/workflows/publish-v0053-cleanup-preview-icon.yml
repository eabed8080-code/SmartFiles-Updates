name: Publish Smart Life v0.5.6 Three Dot File Options

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0053-cleanup-preview-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download signed Smart Life v0.5.6 APK artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-ffa0-81f7-8925-0ec116767146/raw?se=2026-09-04T21%3A10%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=bc9aa6bf-df3e-58ae-9eee-886870aca93c&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T20%3A28%3A44Z&ske=2026-09-05T20%3A28%3A44Z&sks=b&skv=2026-02-06&sig=p6oB1RlSBfvrSIqQ0Qq8ghYCNCJf0HvS4rNf5J47bvQ%3D' -o /tmp/smart-life-v0056.zip
          test "$(sha256sum /tmp/smart-life-v0056.zip | awk '{print $1}')" = '4dc30d8d75c62648466efd15655e30b655510385b5c626f8201696f1482bac55'
          rm -rf /tmp/smart-life-v0056
          mkdir -p /tmp/smart-life-v0056
          unzip -q /tmp/smart-life-v0056.zip -d /tmp/smart-life-v0056
          test -f /tmp/smart-life-v0056/Smart-Life-Flutter-Test.apk
          cp /tmp/smart-life-v0056/Smart-Life-Flutter-Test.apk Smart-Life-Flutter-Test.apk
          test "$(stat -c%s Smart-Life-Flutter-Test.apk)" -gt 1000000

      - name: Verify signed release metadata
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$TOOLS/apksigner" verify --verbose Smart-Life-Flutter-Test.apk
          BADGING="$("$TOOLS/aapt" dump badging Smart-Life-Flutter-Test.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionCode='6038'"
          echo "$BADGING" | grep -q "versionName='0.5.6'"
          sha256sum Smart-Life-Flutter-Test.apk
          ls -lh Smart-Life-Flutter-Test.apk

      - name: Update Smart Life feed
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.5.6",
            "versionCode": 6038,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Converter stays as the normal quick unit converter. Find > File Types/Search results now use a three-dot File Options menu instead of the row of action buttons, with Open, Add to Category, Rename, Share, Convert when supported, and Details."
          }
          JSON

      - name: Publish updater APK and feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Smart Life Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.5.6 build 6038' || true
          git pull --rebase origin main
          git push origin main
