name: Publish Smart Life v0.5.5 File Types Conversion

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0053-cleanup-preview-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download signed Smart Life v0.5.5 APK artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-3354-81f7-92d5-b062c3012548/raw?se=2026-09-04T20%3A51%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=922a4749-225b-5252-930b-1feb83f5cabe&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T01%3A43%3A20Z&ske=2026-09-05T01%3A43%3A20Z&sks=b&skv=2026-02-06&sig=0T1bzdK0rOfAtlN0tHyADG5MhkmN0WuzJlJGGbQZuQs%3D' -o /tmp/smart-life-v0055.zip
          test "$(sha256sum /tmp/smart-life-v0055.zip | awk '{print $1}')" = '04bdd02d1390f74e9db04d3494e24de4ec295a97e20a26fe68a258f7b6bd8b78'
          rm -rf /tmp/smart-life-v0055
          mkdir -p /tmp/smart-life-v0055
          unzip -q /tmp/smart-life-v0055.zip -d /tmp/smart-life-v0055
          test -f /tmp/smart-life-v0055/Smart-Life-Flutter-Test.apk
          cp /tmp/smart-life-v0055/Smart-Life-Flutter-Test.apk Smart-Life-Flutter-Test.apk
          test "$(stat -c%s Smart-Life-Flutter-Test.apk)" -gt 1000000

      - name: Verify signed release metadata
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$TOOLS/apksigner" verify --verbose Smart-Life-Flutter-Test.apk
          BADGING="$("$TOOLS/aapt" dump badging Smart-Life-Flutter-Test.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionCode='6037'"
          echo "$BADGING" | grep -q "versionName='0.5.5'"
          sha256sum Smart-Life-Flutter-Test.apk
          ls -lh Smart-Life-Flutter-Test.apk

      - name: Update Smart Life feed
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.5.5",
            "versionCode": 6037,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Converter is back to quick everyday unit conversions only. File conversion is now handled from Find > File Types/Search results through the file actions menu, with Convert shown only for supported file types."
          }
          JSON

      - name: Publish updater APK and feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Smart Life Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.5.5 build 6037' || true
          git pull --rebase origin main
          git push origin main
