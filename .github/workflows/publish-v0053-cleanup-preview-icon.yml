name: Publish Smart Life v0.5.8 Smart File Types

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0053-cleanup-preview-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download signed Smart Life v0.5.8 APK artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-3620-81f5-b43e-65ee0912f014/raw?se=2026-09-04T23%3A46%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=4b1ff665-95b4-5715-91c6-487c639f93c5&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T23%3A16%3A14Z&ske=2026-09-05T23%3A16%3A14Z&sks=b&skv=2026-02-06&sig=IOmy2/OcKWa5OVPmioPwfDK0SOyEa4FBqIbwclxMeSY%3D' -o /tmp/smart-life-v0058.zip
          test "$(sha256sum /tmp/smart-life-v0058.zip | awk '{print $1}')" = 'd89cb3b74be754706f1b0986df3a370c6e7ee6793fabce9731d701e65ebd9e2e'
          rm -rf /tmp/smart-life-v0058
          mkdir -p /tmp/smart-life-v0058
          unzip -q /tmp/smart-life-v0058.zip -d /tmp/smart-life-v0058
          test -f /tmp/smart-life-v0058/Smart-Life-Flutter-Test.apk
          cp /tmp/smart-life-v0058/Smart-Life-Flutter-Test.apk Smart-Life-Flutter-Test.apk
          test "$(stat -c%s Smart-Life-Flutter-Test.apk)" -gt 1000000

      - name: Verify signed release metadata
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$TOOLS/apksigner" verify --verbose Smart-Life-Flutter-Test.apk
          BADGING="$("$TOOLS/aapt" dump badging Smart-Life-Flutter-Test.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionCode='6040'"
          echo "$BADGING" | grep -q "versionName='0.5.8'"
          test "$(sha256sum Smart-Life-Flutter-Test.apk | awk '{print $1}')" = '38b082b71149ffd5af26d4826b11f4a816b62d5c9c34bccfafcd9e5e223ec24b'
          sha256sum Smart-Life-Flutter-Test.apk
          ls -lh Smart-Life-Flutter-Test.apk

      - name: Update Smart Life feed
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.5.8",
            "versionCode": 6040,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "File Types adds persistent Favorites/Pin with favorite files pinned above other results, a Large Files smart filter with type-aware size thresholds, and a Smart Summary showing file count, total size, largest file, and newest activity. Favorites remain saved across app restarts and follow a file when it is renamed."
          }
          JSON

      - name: Publish updater APK and feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Smart Life Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.5.8 build 6040' || true
          git pull --rebase origin main
          git push origin main
