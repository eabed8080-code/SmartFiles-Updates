name: Publish Smart Life v0.6.2 Startup Hotfix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0053-cleanup-preview-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download signed Smart Life v0.6.2 APK artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-158c-81f5-8edf-07413b3341a3/raw?se=2026-09-05T04%3A07%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=945122d4-e68a-5eef-a94b-ec088f1acb01&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T23%3A13%3A27Z&ske=2026-09-05T23%3A13%3A27Z&sks=b&skv=2026-02-06&sig=sunu6w5JafdtZN6vgAjw5r2vzC1hLuWAmiMtWQhQ5i4%3D' -o /tmp/smart-life-v0062.zip
          test "$(sha256sum /tmp/smart-life-v0062.zip | awk '{print $1}')" = 'fc9de1bc95a23e8cc22f3b68e2e202f190710c9cd1c3680e9dd58a4a3c1233fb'
          rm -rf /tmp/smart-life-v0062
          mkdir -p /tmp/smart-life-v0062
          unzip -q /tmp/smart-life-v0062.zip -d /tmp/smart-life-v0062
          test -f /tmp/smart-life-v0062/Smart-Life-v0.6.2-Hotfix.apk
          cp /tmp/smart-life-v0062/Smart-Life-v0.6.2-Hotfix.apk Smart-Life-Flutter-Test.apk
          test "$(stat -c%s Smart-Life-Flutter-Test.apk)" -gt 1000000

      - name: Verify signed Android release metadata
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$TOOLS/apksigner" verify --verbose Smart-Life-Flutter-Test.apk
          BADGING="$("$TOOLS/aapt" dump badging Smart-Life-Flutter-Test.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionCode='6044'"
          echo "$BADGING" | grep -q "versionName='0.6.2'"
          test "$(sha256sum Smart-Life-Flutter-Test.apk | awk '{print $1}')" = '1c7e13986323c9d448240364822f681b5f4cb7700ad91d3603f9280576ca87de'
          sha256sum Smart-Life-Flutter-Test.apk
          ls -lh Smart-Life-Flutter-Test.apk

      - name: Keep Smart Life PC Receiver setup
        shell: bash
        run: |
          set -euo pipefail
          test -f Smart-Life-PC-Receiver-Setup.exe
          test "$(stat -c%s Smart-Life-PC-Receiver-Setup.exe)" -gt 1000000

      - name: Update Smart Life feeds
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.6.2",
            "versionCode": 6044,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Startup hotfix after v0.6.1. Quick Transfer no longer starts background retry/network work during normal Smart Life launch. The phone receiver starts only after a PC connection is configured, and all Quick Transfer startup work is isolated so it cannot prevent Smart Life from opening. Quick Transfer features remain available."
          }
          JSON

          cat > pc-latest.json <<'JSON'
          {
            "versionName": "0.5.0",
            "setupUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-PC-Receiver-Setup.exe",
            "releaseNotes": "Quick Transfer PC Receiver runs in the background, starts with Windows, keeps phone-bound files in Pending, supports drag & drop, and stores received phone files in Smart Life Inbox."
          }
          JSON

      - name: Publish Smart Life v0.6.2 hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Smart Life Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json pc-latest.json
          git commit -m 'Publish Smart Life v0.6.2 build 6044 startup hotfix' || true
          git pull --rebase origin main
          git push origin main
