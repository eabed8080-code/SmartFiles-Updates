name: Publish Smart Life v0.8.4 Share Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-flutter-v0084-share-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify signed v0.8.4 artifact
        shell: bash
        env:
          SOURCE_URL: 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-7744-81f7-aa39-82e168158fc0/raw?se=2026-09-07T02%3A41%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=25df5513-a9ca-50b4-880c-c235f5abd96d&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T10%3A04%3A44Z&ske=2026-09-07T10%3A04%3A44Z&sks=b&skv=2026-02-06&sig=/FokY7Ir7NXZ30ThB64mNIY2GMQ7fE8Tw9f/x5m%2Bzsg%3D'
          EXPECTED_SHA256: 'd528c5c526820500c42c6c8be8b389beb2ac93ea010f4ff219e1ffafcf6bdf02'
        run: |
          set -euo pipefail
          rm -rf incoming-v084
          mkdir incoming-v084
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o incoming-v084/artifact.zip
          unzip -q incoming-v084/artifact.zip -d incoming-v084/unpacked
          APK="$(find incoming-v084/unpacked -type f -name 'Smart-Life-v0.8.4-Share-Diagnostics.apk' -print -quit)"
          test -n "$APK"
          ACTUAL_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "APK SHA256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          cp "$APK" Smart-Life-Flutter-Test.apk

      - name: Verify APK identity before publish
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          CERT="$($TOOLS/apksigner verify --verbose --print-certs Smart-Life-Flutter-Test.apk)"
          printf '%s' "$CERT" | tr '[:upper:]' '[:lower:]' | tr -d ': ' | grep -q 'fba1a652ac3ed950b45ea26585cccbeb8497153f137f761d17ea12cae71c955b'
          BADGING="$("$TOOLS/aapt" dump badging Smart-Life-Flutter-Test.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionName='0.8.4'"
          echo "$BADGING" | grep -q "versionCode='10066'"

      - name: Write v0.8.4 update metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.8.4",
            "versionCode": 10066,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Android Share diagnostics for the WhatsApp/PDF viewer case. If no file URI is received, Smart Life now shows the incoming Intent action, MIME type, data, ClipData details, and extras so the exact share payload can be identified. Startup, URI collection, and PC upload transport remain unchanged."
          }
          JSON

      - name: Publish to Smart Life update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.8.4 (10066) share diagnostics'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify published metadata and APK remotely
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED_COMMIT="$(git rev-parse HEAD)"
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/flutter-latest.json" -o /tmp/published-latest.json
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/Smart-Life-Flutter-Test.apk" -o /tmp/published.apk
          grep -q '"versionName": "0.8.4"' /tmp/published-latest.json
          grep -q '"versionCode": 10066' /tmp/published-latest.json
          test "$(sha256sum /tmp/published.apk | awk '{print $1}')" = 'd528c5c526820500c42c6c8be8b389beb2ac93ea010f4ff219e1ffafcf6bdf02'
          echo 'Smart Life v0.8.4 diagnostic update channel verified remotely.'
