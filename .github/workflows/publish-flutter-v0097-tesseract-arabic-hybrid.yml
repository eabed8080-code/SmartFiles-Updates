name: Publish Smart Life v0.9.7 Tesseract Arabic Hybrid OCR

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-flutter-v0097-tesseract-arabic-hybrid.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify signed v0.9.7 artifact
        shell: bash
        env:
          SOURCE_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-495c-81f5-a1a8-17558b22e1d7/raw?se=2026-09-08T18%3A33%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=f308e7db-ee47-5026-a225-769f8823c17b&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-07T20%3A15%3A38Z&ske=2026-09-08T20%3A15%3A38Z&sks=b&skv=2026-02-06&sig=0U1oqPf0wEox4Ppm2SknW7uav0iANBFNtCtJyvX0%2BT8%3D'
          EXPECTED_SHA256: 'b4beed86ca91cc203410362a0359aebe27cc91581aa86616ef4b44a3e23632ba'
        run: |
          set -euo pipefail
          rm -rf incoming-v097
          mkdir incoming-v097
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o incoming-v097/artifact.zip
          unzip -q incoming-v097/artifact.zip -d incoming-v097/unpacked
          APK="$(find incoming-v097/unpacked -type f -name 'Smart-Life-v0.9.7-Tesseract-Arabic-Hybrid.apk' -print -quit)"
          test -n "$APK"
          ACTUAL_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "APK SHA256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          cp "$APK" Smart-Life-Flutter-Test.apk

      - name: Verify APK identity and OCR payload before publish
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          CERT="$($TOOLS/apksigner verify --verbose --print-certs Smart-Life-Flutter-Test.apk)"
          printf '%s' "$CERT" | tr '[:upper:]' '[:lower:]' | tr -d ': ' | grep -q 'fba1a652ac3ed950b45ea26585cccbeb8497153f137f761d17ea12cae71c955b'
          BADGING="$("$TOOLS/aapt" dump badging Smart-Life-Flutter-Test.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionName='0.9.7'"
          echo "$BADGING" | grep -q "versionCode='10079'"
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'assets/tessdata/ara.traineddata'
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'assets/tessdata/eng.traineddata'
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'lib/arm64-v8a/libtesseract.so'
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'lib/arm64-v8a/libopencv_java4.so'

      - name: Write v0.9.7 update metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.9.7",
            "versionCode": 10079,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Arabic OCR is upgraded to a hybrid local pipeline. Smart Life keeps PaddleOCR for the English/number path and adds Tesseract 5 with official Arabic+English trained data as the Arabic recovery engine. Visual OCR output from both engines is merged into the same existing Smart Search row. The completed Smart Search index is NOT cleared or rebuilt. Arabic Rescue uses a new repair checkpoint generation so files previously attempted with Paddle-only OCR can be retried once with Tesseract and merged into the existing index. Search normalization, English/number search, Pause/Resume checkpoints, Turbo OCR, one-file OCR diagnostic, Connect to PC, reminders, sounds, and prior Smart Life behavior are preserved."
          }
          JSON

      - name: Publish to Smart Life update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.9.7 (10079) Tesseract Arabic Hybrid OCR'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify published metadata and APK remotely
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED_COMMIT="$(git rev-parse HEAD)"
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/flutter-latest.json" -o /tmp/published-latest.json
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/Smart-Life-Flutter-Test.apk" -o /tmp/published.apk
          grep -q '"versionName": "0.9.7"' /tmp/published-latest.json
          grep -q '"versionCode": 10079' /tmp/published-latest.json
          test "$(sha256sum /tmp/published.apk | awk '{print $1}')" = 'b4beed86ca91cc203410362a0359aebe27cc91581aa86616ef4b44a3e23632ba'
          echo 'Smart Life v0.9.7 update channel verified remotely.'
