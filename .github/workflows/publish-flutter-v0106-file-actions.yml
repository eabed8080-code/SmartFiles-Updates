name: Publish Smart Life v0.10.6 File Actions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-flutter-v0106-file-actions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify signed v0.10.6 artifact
        shell: bash
        env:
          SOURCE_URL: 'https://sdmntprwestus2.oaiusercontent.com/files/00000000-ea60-81f8-b7e2-3c50f6b03d3f/raw?se=2026-09-09T18%3A59%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=7eebe7ed-35cb-57b1-a45a-193b84e55ad4&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-09T18%3A44%3A23Z&ske=2026-09-10T18%3A44%3A23Z&sks=b&skv=2026-02-06&sig=39cxakbS5kIbQjuauF3KVn3NHN4l4dhIfspyw1gSAf8%3D'
          EXPECTED_SHA256: '80c4041dfdd958d05be5c4a59ecce313f85614f4b731b5a6562298584ad88f6d'
          EXPECTED_SIZE: '91956839'
        run: |
          set -euo pipefail
          rm -rf incoming-v0106
          mkdir incoming-v0106
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o incoming-v0106/artifact.zip
          unzip -q incoming-v0106/artifact.zip -d incoming-v0106/unpacked
          APK="$(find incoming-v0106/unpacked -type f -name 'Smart-Life-v0.10.6-File-Actions.apk' -print -quit)"
          test -n "$APK"
          ACTUAL_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "APK SHA256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          SIZE="$(stat -c %s "$APK")"
          echo "APK bytes: $SIZE"
          test "$SIZE" = "$EXPECTED_SIZE"
          cp "$APK" Smart-Life-Flutter-Test.apk

      - name: Verify APK identity and OCR payload
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          CERT="$($TOOLS/apksigner verify --verbose --print-certs Smart-Life-Flutter-Test.apk)"
          printf '%s' "$CERT" | tr '[:upper:]' '[:lower:]' | tr -d ': ' | grep -q 'fba1a652ac3ed950b45ea26585cccbeb8497153f137f761d17ea12cae71c955b'
          BADGING="$("$TOOLS/aapt" dump badging Smart-Life-Flutter-Test.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionName='0.10.6'"
          echo "$BADGING" | grep -q "versionCode='10088'"
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'assets/easyocr/easyocr_arabic_charset.txt'
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'assets/models/rec/inference.onnx'
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'assets/models/det/inference.onnx'
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'lib/arm64-v8a/libonnxruntime.so'

      - name: Write v0.10.6 update metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.10.6",
            "versionCode": 10088,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Find selection actions are expanded: selecting one file now offers Share, Rename, Add to Category, and Delete; selecting multiple files offers Share, Add to Category, and bulk Delete. Delete permanently removes the selected files from the phone after confirmation and refreshes the saved Find index. Rename remains single-file only so a file can be named correctly before categorizing it. The startup grow/shrink opening transition is removed so Smart Life opens directly into Find."
          }
          JSON

      - name: Publish update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.10.6 (10088) file actions static startup'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify published update remotely
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED_COMMIT="$(git rev-parse HEAD)"
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/flutter-latest.json" -o /tmp/published-latest.json
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/Smart-Life-Flutter-Test.apk" -o /tmp/published.apk
          grep -q '"versionName": "0.10.6"' /tmp/published-latest.json
          grep -q '"versionCode": 10088' /tmp/published-latest.json
          test "$(sha256sum /tmp/published.apk | awk '{print $1}')" = '80c4041dfdd958d05be5c4a59ecce313f85614f4b731b5a6562298584ad88f6d'
          echo 'Smart Life v0.10.6 update channel verified remotely.'
