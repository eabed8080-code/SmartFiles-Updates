name: Publish Smart Life v0.8.9 Local OCR Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-flutter-v0089-local-ocr-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify signed v0.8.9 artifact
        shell: bash
        env:
          SOURCE_URL: 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-fcf0-81f7-b404-b74ff876a7ee/raw?se=2026-09-07T18%3A45%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=4a36943e-2d00-56a1-84fa-7abef5038b4c&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T21%3A29%3A20Z&ske=2026-09-07T21%3A29%3A20Z&sks=b&skv=2026-02-06&sig=PtrSz/ex0hUo7RYcxpIN77Y5Cpkf5v8YpolgXkmodZY%3D'
          EXPECTED_SHA256: '41f34dddda11c55bbb3a1c6b82564c5588a5cabc988824cd1a1dd754be0e611f'
        run: |
          set -euo pipefail
          rm -rf incoming-v089
          mkdir incoming-v089
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o incoming-v089/artifact.zip
          unzip -q incoming-v089/artifact.zip -d incoming-v089/unpacked
          APK="$(find incoming-v089/unpacked -type f -name 'Smart-Life-v0.8.9-Local-OCR-Recovery.apk' -print -quit)"
          test -n "$APK"
          ACTUAL_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "APK SHA256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          cp "$APK" Smart-Life-Flutter-Test.apk

      - name: Verify APK identity before publish
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          CERT="$($TOOLS/apksigner verify --verbose --print-certs Smart-Life-Flutter-Test.apk)"
          printf '%s' "$CERT" | tr '[:upper:]' '[:lower:]' | tr -d ': ' | grep -q 'fba1a652ac3ed950b45ea26585cccbeb8497153f137f761d17ea12cae71c955b'
          BADGING="$("$TOOLS/aapt" dump badging Smart-Life-Flutter-Test.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionName='0.8.9'"
          echo "$BADGING" | grep -q "versionCode='10071'"

      - name: Write v0.8.9 update metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.8.9",
            "versionCode": 10071,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Recovers Smart Search local PaddleOCR runtime on Android by using one shared OpenCV runtime, keeps Arabic and English OCR fully on-device, and allows embedded-text PDFs to keep indexing even if an OCR-dependent file fails. Existing Search by Name, Search Content, Connect to PC, Transfer Status, reminders, sound dropdowns, and previous Smart Life behavior are preserved."
          }
          JSON

      - name: Publish to Smart Life update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.8.9 (10071) Local OCR Recovery'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify published metadata and APK remotely
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED_COMMIT="$(git rev-parse HEAD)"
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/flutter-latest.json" -o /tmp/published-latest.json
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/Smart-Life-Flutter-Test.apk" -o /tmp/published.apk
          grep -q '"versionName": "0.8.9"' /tmp/published-latest.json
          grep -q '"versionCode": 10071' /tmp/published-latest.json
          test "$(sha256sum /tmp/published.apk | awk '{print $1}')" = '41f34dddda11c55bbb3a1c6b82564c5588a5cabc988824cd1a1dd754be0e611f'
          echo 'Smart Life v0.8.9 update channel verified remotely.'
