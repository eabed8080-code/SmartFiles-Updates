name: Publish Smart Life v0.7.4 PDF Stage 1 Safe Index

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-flutter-v0074.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify signed v0.7.4 artifact
        shell: bash
        env:
          SOURCE_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-f8d0-81f5-b1b1-a9abdbc87229/raw?se=2026-09-05T22%3A45%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=bba3c702-2d80-5931-a3af-0f4f8ea61133&skoid=732f244e-db13-47c3-bcc7-7ee02a9397bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T22%3A15%3A41Z&ske=2026-09-06T22%3A15%3A41Z&sks=b&skv=2026-02-06&sig=6KUj1UpiWH5CJQTGnoT4uE9ZofWc7kPzZqwNow078xQ%3D'
          EXPECTED_SHA256: '67169301ec3b14970db0b73cc7072d07ce1230dc85cf23e2ea0ea6d7054091ee'
        run: |
          set -euo pipefail
          rm -rf incoming-v074
          mkdir incoming-v074
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o incoming-v074/artifact.zip
          unzip -q incoming-v074/artifact.zip -d incoming-v074/unpacked
          APK="$(find incoming-v074/unpacked -type f -name 'Smart-Life-v0.7.4-PDF-Stage1-Safe.apk' -print -quit)"
          test -n "$APK"
          ACTUAL_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "APK SHA256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          cp "$APK" Smart-Life-Flutter-Test.apk

      - name: Write v0.7.4 update metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.7.4",
            "versionCode": 6056,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "PDF Stage 1 reliability test: Smart Search is still limited to PDFs only and now checks exactly one PDF at a time with OCR completely disabled. Searchable PDF text is saved immediately. Scanned/image PDFs are checkpointed for the next OCR stage without attempting OCR yet. Malformed, encrypted, or unreadable PDFs are isolated per file and cannot stop the remaining PDFs. The Stage 1 progress runs through the full PDF list, reports searchable/scanned/failed counts, and uses a fresh local PDF index. Images remain excluded while the PDF pipeline is validated."
          }
          JSON

      - name: Publish to Smart Life update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.7.4 (6056)'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify published metadata and APK hash
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"versionName": "0.7.4"' flutter-latest.json
          grep -q '"versionCode": 6056' flutter-latest.json
          test "$(sha256sum Smart-Life-Flutter-Test.apk | awk '{print $1}')" = '67169301ec3b14970db0b73cc7072d07ce1230dc85cf23e2ea0ea6d7054091ee'
          PUBLISHED_COMMIT="$(git rev-parse HEAD)"
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/flutter-latest.json" -o /tmp/published-latest.json
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/Smart-Life-Flutter-Test.apk" -o /tmp/published.apk
          grep -q '"versionName": "0.7.4"' /tmp/published-latest.json
          grep -q '"versionCode": 6056' /tmp/published-latest.json
          test "$(sha256sum /tmp/published.apk | awk '{print $1}')" = '67169301ec3b14970db0b73cc7072d07ce1230dc85cf23e2ea0ea6d7054091ee'
          echo 'Smart Life v0.7.4 update channel verified remotely.'
