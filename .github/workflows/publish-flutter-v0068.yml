name: Publish Smart Life v0.6.8 Image PDF Smart Search

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-flutter-v0068.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify signed v0.6.8 artifact
        shell: bash
        env:
          SOURCE_URL: 'https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-cca4-820c-9b69-fda013fbfdc9/raw?se=2026-09-05T18%3A36%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=78602455-03c3-5f78-b7c6-5907f9e257d9&skoid=732f244e-db13-47c3-bcc7-7ee02a9397bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T23%3A20%3A17Z&ske=2026-09-05T23%3A20%3A17Z&sks=b&skv=2026-02-06&sig=hCStdX2w3IzVCZsiN0dnHrxhajv8WeMheOnWZPckDD4%3D'
          EXPECTED_SHA256: 'a8f2ebd9ce602af4fe0f4cc8518f01dc80f6686ce1d8bcd75f0616e5cec8778b'
        run: |
          set -euo pipefail
          rm -rf incoming-v068
          mkdir incoming-v068
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o incoming-v068/artifact.zip
          unzip -q incoming-v068/artifact.zip -d incoming-v068/unpacked
          APK="$(find incoming-v068/unpacked -type f -name 'Smart-Life-v0.6.8-Image-PDF-Smart-Search.apk' -print -quit)"
          test -n "$APK"
          ACTUAL_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "APK SHA256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          cp "$APK" Smart-Life-Flutter-Test.apk

      - name: Write v0.6.8 update metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.6.8",
            "versionCode": 6050,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Smart Search update: the existing search box now automatically searches inside Images and PDFs. Images use local on-device OCR, WhatsApp Images and Screenshots are indexed first, scanned/image PDFs get OCR fallback, and filename results remain available while the local index is preparing. Existing voice search, compact File Types, Converter cleanup, and opening motion are preserved."
          }
          JSON

      - name: Publish to Smart Life update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.6.8 (6050)'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify published metadata and APK hash
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"versionName": "0.6.8"' flutter-latest.json
          grep -q '"versionCode": 6050' flutter-latest.json
          test "$(sha256sum Smart-Life-Flutter-Test.apk | awk '{print $1}')" = 'a8f2ebd9ce602af4fe0f4cc8518f01dc80f6686ce1d8bcd75f0616e5cec8778b'
          PUBLISHED_COMMIT="$(git rev-parse HEAD)"
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/flutter-latest.json" -o /tmp/published-latest.json
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/Smart-Life-Flutter-Test.apk" -o /tmp/published.apk
          grep -q '"versionName": "0.6.8"' /tmp/published-latest.json
          grep -q '"versionCode": 6050' /tmp/published-latest.json
          test "$(sha256sum /tmp/published.apk | awk '{print $1}')" = 'a8f2ebd9ce602af4fe0f4cc8518f01dc80f6686ce1d8bcd75f0616e5cec8778b'
          echo 'Smart Life v0.6.8 update channel verified remotely.'
