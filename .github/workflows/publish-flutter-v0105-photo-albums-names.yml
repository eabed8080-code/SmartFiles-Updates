name: Publish Smart Life v0.10.5 Photo Albums & Names

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-flutter-v0105-photo-albums-names.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify signed v0.10.5 artifact
        shell: bash
        env:
          SOURCE_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-215c-8210-926d-2d083868b8ff/raw?se=2026-09-09T14%3A49%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=76bb197f-d023-570b-840e-7f585cf675ed&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-09T12%3A23%3A01Z&ske=2026-09-10T12%3A23%3A01Z&sks=b&skv=2026-02-06&sig=dEA/zrH6i2gyUlbJl5MBxnTAL528v2ohmuw40noD1sI%3D'
          EXPECTED_SHA256: 'fbcad860114d3b01849e2665a0de26f4b734a43bdce4cd136c088ee9bce78a72'
          EXPECTED_SIZE: '91956839'
        run: |
          set -euo pipefail
          rm -rf incoming-v0105
          mkdir incoming-v0105
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o incoming-v0105/artifact.zip
          unzip -q incoming-v0105/artifact.zip -d incoming-v0105/unpacked
          APK="$(find incoming-v0105/unpacked -type f -name 'Smart-Life-v0.10.5-Photo-Albums-Names.apk' -print -quit)"
          test -n "$APK"
          ACTUAL_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "APK SHA256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          SIZE="$(stat -c %s "$APK")"
          echo "APK bytes: $SIZE"
          test "$SIZE" = "$EXPECTED_SIZE"
          cp "$APK" Smart-Life-Flutter-Test.apk

      - name: Verify APK identity and OCR payload
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          CERT="$($TOOLS/apksigner verify --verbose --print-certs Smart-Life-Flutter-Test.apk)"
          printf '%s' "$CERT" | tr '[:upper:]' '[:lower:]' | tr -d ': ' | grep -q 'fba1a652ac3ed950b45ea26585cccbeb8497153f137f761d17ea12cae71c955b'
          BADGING="$("$TOOLS/aapt" dump badging Smart-Life-Flutter-Test.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionName='0.10.5'"
          echo "$BADGING" | grep -q "versionCode='10087'"
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'assets/easyocr/easyocr_arabic_charset.txt'
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'assets/models/rec/inference.onnx'
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'assets/models/det/inference.onnx'
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'lib/arm64-v8a/libonnxruntime.so'

      - name: Write v0.10.5 update metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.10.5",
            "versionCode": 10087,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Photos multi-select now includes Share, Move, Delete, and More. Move, Copy to Album, Create Album, and Delete are real Android media operations so changes are reflected in the device gallery. More includes Copy to Album, Add to Favorites, and Create Album. A new Photo file names setting can show each filename under its thumbnail with fixed one-line spacing and ellipsis for long names. Category Rename and the existing saved-index-first Search behavior are preserved."
          }
          JSON

      - name: Publish update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.10.5 (10087) photo albums names'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify published update remotely
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED_COMMIT="$(git rev-parse HEAD)"
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/flutter-latest.json" -o /tmp/published-latest.json
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/Smart-Life-Flutter-Test.apk" -o /tmp/published.apk
          grep -q '"versionName": "0.10.5"' /tmp/published-latest.json
          grep -q '"versionCode": 10087' /tmp/published-latest.json
          test "$(sha256sum /tmp/published.apk | awk '{print $1}')" = 'fbcad860114d3b01849e2665a0de26f4b734a43bdce4cd136c088ee9bce78a72'
          echo 'Smart Life v0.10.5 update channel verified remotely.'
