name: Publish Smart Files v0.50

on:
  push:
    paths:
      - '.github/workflows/publish-v050.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified v0.50 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-1454-81f7-b63a-eab832df55d2/raw?se=2026-09-01T01%3A13%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=ad7dc03d-1e79-5348-a3b4-1e4d6d3dabd5&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T21%3A52%3A33Z&ske=2026-09-01T21%3A52%3A33Z&sks=b&skv=2026-02-06&sig=N76zl4LnRGQ6lb2bdVtK/40TPN/cx1At6B5chUfvI2s%3D' -o /tmp/v050.zip
          rm -rf /tmp/v050
          mkdir -p /tmp/v050
          unzip -q /tmp/v050.zip -d /tmp/v050
          test -f /tmp/v050/dist/Smart-Files.apk
          cp /tmp/v050/dist/Smart-Files.apk ./Smart-Files.apk
          sha256sum ./Smart-Files.apk
      - name: Update feed
        shell: bash
        run: |
          cat > latest.json <<'JSON'
          {
            "versionName": "0.50",
            "versionCode": 52,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Files.apk",
            "releaseNotes": "Smart Files V0.50 adds a lightweight 2D mascot that moves between controls and reacts to search, indexing, photos and update actions."
          }
          JSON
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart-Files.apk latest.json
          git commit -m 'Publish Smart Files v0.50' || exit 0
          git push
