name: Publish Smart Life v0.6.9 Smart Search Runtime Fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-flutter-v0069.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify signed v0.6.9 artifact
        shell: bash
        env:
          SOURCE_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-c2e4-81f5-92c9-15c094603d1f/raw?se=2026-09-05T19%3A43%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=8b016877-c63c-5290-8ec0-d0c3d72caa9f&skoid=732f244e-db13-47c3-bcc7-7ee02a9397bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T23%3A20%3A43Z&ske=2026-09-05T23%3A20%3A43Z&sks=b&skv=2026-02-06&sig=OEYNnxUUd2gG9tKpt%2BV8PQcKiz4vw2PL%2BpaveQnY5Qo%3D'
          EXPECTED_SHA256: '921d5e236c7b2eb0cea6aef7929ca67b321b08af781d38105cc65bd34a3e41aa'
        run: |
          set -euo pipefail
          rm -rf incoming-v069
          mkdir incoming-v069
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o incoming-v069/artifact.zip
          unzip -q incoming-v069/artifact.zip -d incoming-v069/unpacked
          APK="$(find incoming-v069/unpacked -type f -name 'Smart-Life-v0.6.9-Smart-Search-Runtime-Fix.apk' -print -quit)"
          test -n "$APK"
          ACTUAL_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "APK SHA256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          cp "$APK" Smart-Life-Flutter-Test.apk

      - name: Write v0.6.9 update metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.6.9",
            "versionCode": 6051,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Smart Search reliability fix: OCR content indexing now runs in small progressive batches, restarts automatically when a content search is typed, prioritizes WhatsApp files and Screenshots, retries difficult images through a bounded bitmap OCR path, rebuilds the local content index, and scans up to 12 pages for image/scanned PDFs. Filename search remains immediate while OCR indexing proceeds. Existing voice search, compact File Types, Converter cleanup, and opening motion are preserved."
          }
          JSON

      - name: Publish to Smart Life update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.6.9 (6051)'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify published metadata and APK hash
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"versionName": "0.6.9"' flutter-latest.json
          grep -q '"versionCode": 6051' flutter-latest.json
          test "$(sha256sum Smart-Life-Flutter-Test.apk | awk '{print $1}')" = '921d5e236c7b2eb0cea6aef7929ca67b321b08af781d38105cc65bd34a3e41aa'
          PUBLISHED_COMMIT="$(git rev-parse HEAD)"
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/flutter-latest.json" -o /tmp/published-latest.json
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/Smart-Life-Flutter-Test.apk" -o /tmp/published.apk
          grep -q '"versionName": "0.6.9"' /tmp/published-latest.json
          grep -q '"versionCode": 6051' /tmp/published-latest.json
          test "$(sha256sum /tmp/published.apk | awk '{print $1}')" = '921d5e236c7b2eb0cea6aef7929ca67b321b08af781d38105cc65bd34a3e41aa'
          echo 'Smart Life v0.6.9 update channel verified remotely.'
