name: Publish Smart Life v0.10.2 Batch Category & Inline Sounds

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-flutter-v0102-batch-category-inline-sounds.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify signed v0.10.2 artifact
        shell: bash
        env:
          SOURCE_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-9404-81f5-95b0-7fca90693619/raw?se=2026-09-09T02%3A53%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=8fc96aba-1ae7-5336-9a19-773bbfa9c2c8&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-09T00%3A52%3A24Z&ske=2026-09-10T00%3A52%3A24Z&sks=b&skv=2026-02-06&sig=XaDy9vqg34VTfWhhuY80UWenARqegb0oAv46yua2KY4%3D'
          EXPECTED_SHA256: '182ab9588da5160cb587c0967e58654fc2c30ef6f38e62cbb676948107258c74'
          EXPECTED_SIZE: '91891303'
        run: |
          set -euo pipefail
          rm -rf incoming-v0102
          mkdir incoming-v0102
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o incoming-v0102/artifact.zip
          unzip -q incoming-v0102/artifact.zip -d incoming-v0102/unpacked
          APK="$(find incoming-v0102/unpacked -type f -name 'Smart-Life-v0.10.2-Batch-Category-Inline-Sounds.apk' -print -quit)"
          test -n "$APK"
          ACTUAL_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "APK SHA256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          SIZE="$(stat -c %s "$APK")"
          echo "APK bytes: $SIZE"
          test "$SIZE" = "$EXPECTED_SIZE"
          cp "$APK" Smart-Life-Flutter-Test.apk

      - name: Verify APK identity and OCR payload
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          CERT="$($TOOLS/apksigner verify --verbose --print-certs Smart-Life-Flutter-Test.apk)"
          printf '%s' "$CERT" | tr '[:upper:]' '[:lower:]' | tr -d ': ' | grep -q 'fba1a652ac3ed950b45ea26585cccbeb8497153f137f761d17ea12cae71c955b'
          BADGING="$("$TOOLS/aapt" dump badging Smart-Life-Flutter-Test.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionName='0.10.2'"
          echo "$BADGING" | grep -q "versionCode='10084'"
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'assets/easyocr/easyocr_arabic_charset.txt'
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'assets/models/rec/inference.onnx'
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'assets/models/det/inference.onnx'
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'lib/arm64-v8a/libonnxruntime.so'

      - name: Write v0.10.2 update metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.10.2",
            "versionCode": 10084,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Multi-select now shows a clear Add to Category button so several selected files can be categorized in one action. Navigation effect and Reminder effect now expand their sound choices inline directly below the tapped field, with immediate preview; Reminder repeats remains a dropdown. Existing category status/Uncategorized workflow and Arabic OCR/search stack are preserved."
          }
          JSON

      - name: Publish update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.10.2 (10084) batch category and inline sounds'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify published update remotely
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED_COMMIT="$(git rev-parse HEAD)"
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/flutter-latest.json" -o /tmp/published-latest.json
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/Smart-Life-Flutter-Test.apk" -o /tmp/published.apk
          grep -q '"versionName": "0.10.2"' /tmp/published-latest.json
          grep -q '"versionCode": 10084' /tmp/published-latest.json
          test "$(sha256sum /tmp/published.apk | awk '{print $1}')" = '182ab9588da5160cb587c0967e58654fc2c30ef6f38e62cbb676948107258c74'
          echo 'Smart Life v0.10.2 update channel verified remotely.'
