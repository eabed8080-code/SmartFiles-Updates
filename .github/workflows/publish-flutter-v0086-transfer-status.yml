name: Publish Smart Life v0.8.6 Transfer Status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-flutter-v0086-transfer-status.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify signed v0.8.6 artifact
        shell: bash
        env:
          SOURCE_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-ea94-81f5-9c4d-c020f586027f/raw?se=2026-09-07T04%3A09%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=d23009a8-5c22-58dc-8efd-74b64f68185d&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T12%3A02%3A41Z&ske=2026-09-07T12%3A02%3A41Z&sks=b&skv=2026-02-06&sig=xG3Sy9n2AYbFQ73KFvgDeSYo2ccV4SFM6QxyGJ8Z1kE%3D'
          EXPECTED_SHA256: '1a5d4cb84d49525a9c1cc84aaee1e89d578709f8a068e2778d9d4745cbdfeff2'
        run: |
          set -euo pipefail
          rm -rf incoming-v086
          mkdir incoming-v086
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o incoming-v086/artifact.zip
          unzip -q incoming-v086/artifact.zip -d incoming-v086/unpacked
          APK="$(find incoming-v086/unpacked -type f -name 'Smart-Life-v0.8.6-Transfer-Status.apk' -print -quit)"
          test -n "$APK"
          ACTUAL_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "APK SHA256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          cp "$APK" Smart-Life-Flutter-Test.apk

      - name: Verify APK identity before publish
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          CERT="$($TOOLS/apksigner verify --verbose --print-certs Smart-Life-Flutter-Test.apk)"
          echo "$CERT"
          printf '%s' "$CERT" | tr '[:upper:]' '[:lower:]' | tr -d ': ' | grep -q 'fba1a652ac3ed950b45ea26585cccbeb8497153f137f761d17ea12cae71c955b'
          BADGING="$("$TOOLS/aapt" dump badging Smart-Life-Flutter-Test.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionName='0.8.6'"
          echo "$BADGING" | grep -q "versionCode='10068'"

      - name: Write v0.8.6 update metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.8.6",
            "versionCode": 10068,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Settings now shows outgoing Transfer Status under Connect to PC: All files sent when the phone queue is empty, or the number of files still Pending to PC. The status refreshes when Smart Life resumes and can also be refreshed manually. The proven v0.8.5 Pending queue, immediate send, and background retry transport are unchanged."
          }
          JSON

      - name: Publish to Smart Life update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.8.6 (10068) Transfer Status'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify published metadata and APK remotely
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED_COMMIT="$(git rev-parse HEAD)"
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/flutter-latest.json" -o /tmp/published-latest.json
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/Smart-Life-Flutter-Test.apk" -o /tmp/published.apk
          grep -q '"versionName": "0.8.6"' /tmp/published-latest.json
          grep -q '"versionCode": 10068' /tmp/published-latest.json
          test "$(sha256sum /tmp/published.apk | awk '{print $1}')" = '1a5d4cb84d49525a9c1cc84aaee1e89d578709f8a068e2778d9d4745cbdfeff2'
          echo 'Smart Life v0.8.6 update channel verified remotely.'
