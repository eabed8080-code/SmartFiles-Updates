name: Publish Smart Life v0.8.7 Sounds & Effects

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-flutter-v0087-sounds-effects.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify signed v0.8.7 artifact
        shell: bash
        env:
          SOURCE_URL: 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-6630-81f7-a506-ea5ee0984566/raw?se=2026-09-07T15%3A18%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=49e81261-ea21-5c8a-ab05-f22b88ed136d&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-07T09%3A04%3A44Z&ske=2026-09-08T09%3A04%3A44Z&sks=b&skv=2026-02-06&sig=qF4E/sBCtqFp%2B29rWZ2cxIP0XKqtgssyj05xGT6y2jw%3D'
          EXPECTED_SHA256: 'cac80041fc312ad1fc65ae1dbcdaae739311f998662c92c4920f04b379f6478d'
        run: |
          set -euo pipefail
          rm -rf incoming-v087
          mkdir incoming-v087
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o incoming-v087/artifact.zip
          unzip -q incoming-v087/artifact.zip -d incoming-v087/unpacked
          APK="$(find incoming-v087/unpacked -type f -name 'Smart-Life-v0.8.7-Sounds-Effects.apk' -print -quit)"
          test -n "$APK"
          ACTUAL_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "APK SHA256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          cp "$APK" Smart-Life-Flutter-Test.apk

      - name: Verify APK identity before publish
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          CERT="$($TOOLS/apksigner verify --verbose --print-certs Smart-Life-Flutter-Test.apk)"
          printf '%s' "$CERT" | tr '[:upper:]' '[:lower:]' | tr -d ': ' | grep -q 'fba1a652ac3ed950b45ea26585cccbeb8497153f137f761d17ea12cae71c955b'
          BADGING="$("$TOOLS/aapt" dump badging Smart-Life-Flutter-Test.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionName='0.8.7'"
          echo "$BADGING" | grep -q "versionCode='10069'"

      - name: Write v0.8.7 update metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.8.7",
            "versionCode": 10069,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Adds Sounds & Effects controls in Settings: independent interface and Life Inbox reminder sounds, selectable short effects with preview, volume control, and reminder repeat options including 1x, 3x, and 10x. Reminder effects work from the Android reminder receiver even when Flutter is not open. Existing Connect to PC and Transfer Status behavior is preserved."
          }
          JSON

      - name: Publish to Smart Life update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.8.7 (10069) Sounds & Effects'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify published metadata and APK remotely
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED_COMMIT="$(git rev-parse HEAD)"
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/flutter-latest.json" -o /tmp/published-latest.json
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/Smart-Life-Flutter-Test.apk" -o /tmp/published.apk
          grep -q '"versionName": "0.8.7"' /tmp/published-latest.json
          grep -q '"versionCode": 10069' /tmp/published-latest.json
          test "$(sha256sum /tmp/published.apk | awk '{print $1}')" = 'cac80041fc312ad1fc65ae1dbcdaae739311f998662c92c4920f04b379f6478d'
          echo 'Smart Life v0.8.7 update channel verified remotely.'
