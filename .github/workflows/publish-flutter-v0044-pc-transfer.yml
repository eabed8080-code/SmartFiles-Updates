name: Publish Smart Life v0.4.4 PC Transfer

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-flutter-v0044-pc-transfer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4

      - name: Download signed Flutter APK artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-ea54-81f5-b2e5-2850452ec9cb/raw?se=2026-09-03T21%3A21%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=0e89e680-6399-5ae4-abf8-6f80bc4893f5&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-03T19%3A33%3A06Z&ske=2026-09-04T19%3A33%3A06Z&sks=b&skv=2026-02-06&sig=siA89G28UyWQrmtcO4CKH5UlPhq4GfbehTEVQLkxlrA%3D' -o /tmp/flutter-v044.zip
          rm -rf /tmp/flutter-v044
          mkdir -p /tmp/flutter-v044
          unzip -q /tmp/flutter-v044.zip -d /tmp/flutter-v044
          test -f /tmp/flutter-v044/Smart-Life-Flutter-Test.apk
          cp /tmp/flutter-v044/Smart-Life-Flutter-Test.apk Smart-Life-Flutter-Test.apk
          test "$(stat -c%s Smart-Life-Flutter-Test.apk)" -lt 100000000

      - name: Download Windows receiver artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-eff8-81f7-a1cc-d261bfa45aab/raw?se=2026-09-03T21%3A22%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=dd762730-d8e3-526e-a0bd-1925aca548c5&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-03T19%3A28%3A54Z&ske=2026-09-04T19%3A28%3A54Z&sks=b&skv=2026-02-06&sig=U7IGeh9fOifwVZ//v4wIEcF5lw8nSMOQRuCjU/vDFE8%3D' -o /tmp/pc-receiver.zip
          rm -rf /tmp/pc-receiver
          mkdir -p /tmp/pc-receiver
          unzip -q /tmp/pc-receiver.zip -d /tmp/pc-receiver
          test -f /tmp/pc-receiver/SmartLifeReceiver.exe
          cp /tmp/pc-receiver/SmartLifeReceiver.exe Smart-Life-PC-Receiver.exe
          test "$(stat -c%s Smart-Life-PC-Receiver.exe)" -lt 100000000

      - name: Update Flutter feed
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.4.4",
            "versionCode": 26,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Phone to PC transfer phase 1: Smart Life now adds Connect to PC in Settings and a Send to PC option in Android Share for images and PDF files. The phone and Windows computer must be on the same Wi-Fi network. The Windows Smart Life PC Receiver uses a pairing code and saves received files to Downloads\\Smart Life."
          }
          JSON

      - name: Publish phone update and PC receiver
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Smart Life Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk Smart-Life-PC-Receiver.exe flutter-latest.json
          git commit -m 'Publish Smart Life v0.4.4 phone to PC transfer' || true
          git pull --rebase origin main
          git push origin main
