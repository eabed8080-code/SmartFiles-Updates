name: Publish Smart Life v0.10.9 Today & Clean Photos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-flutter-v0109-today-clean-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify signed v0.10.9 artifact
        shell: bash
        env:
          SOURCE_URL: 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-fc6c-81f7-96cc-b81e5a11abff/raw?se=2026-09-10T01%3A57%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=412cfd8a-5e6a-57ba-a070-a19b912bbef1&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-10T01%3A43%3A40Z&ske=2026-09-11T01%3A43%3A40Z&sks=b&skv=2026-02-06&sig=D7DHzTJJmXdoitb6pkLY2kLVP77QcwDWs8iu00k/ghM%3D'
          EXPECTED_ZIP_SHA256: 'af29c1ee13a2b4712ad4645541391af707f57edaceaaffd3acf8fe1018145124'
          EXPECTED_APK_SHA256: 'eb27c3f5b95f7e3e7f0ca29a2a577ba30c8766dfac5535e1dff44e7ccdae97e5'
          EXPECTED_SIZE: '91956839'
        run: |
          set -euo pipefail
          rm -rf incoming-v0109
          mkdir incoming-v0109
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o incoming-v0109/artifact.zip
          test "$(sha256sum incoming-v0109/artifact.zip | awk '{print $1}')" = "$EXPECTED_ZIP_SHA256"
          unzip -q incoming-v0109/artifact.zip -d incoming-v0109/unpacked
          APK="$(find incoming-v0109/unpacked -type f -name 'Smart-Life-v0.10.9-Today-Clean-Photos.apk' -print -quit)"
          test -n "$APK"
          test "$(sha256sum "$APK" | awk '{print $1}')" = "$EXPECTED_APK_SHA256"
          test "$(stat -c %s "$APK")" = "$EXPECTED_SIZE"
          cp "$APK" Smart-Life-Flutter-Test.apk

      - name: Verify APK identity and OCR payload
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          CERT="$($TOOLS/apksigner verify --verbose --print-certs Smart-Life-Flutter-Test.apk)"
          printf '%s' "$CERT" | tr '[:upper:]' '[:lower:]' | tr -d ': ' | grep -q 'fba1a652ac3ed950b45ea26585cccbeb8497153f137f761d17ea12cae71c955b'
          BADGING="$("$TOOLS/aapt" dump badging Smart-Life-Flutter-Test.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionName='0.10.9'"
          echo "$BADGING" | grep -q "versionCode='10091'"
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'assets/easyocr/easyocr_arabic_charset.txt'
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'assets/models/rec/inference.onnx'
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'assets/models/det/inference.onnx'
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'lib/arm64-v8a/libonnxruntime.so'

      - name: Write v0.10.9 update metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.10.9",
            "versionCode": 10091,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Today replaces Converter and shows items newly added to the phone today from MediaStore without rebuilding Smart Search or OCR indexes. Photos no longer shows the Albums / Folders strip on the main page; Years is moved up and presented as cleaner horizontal year cards. Real album create/move/rename behavior remains available, and the existing photo actions, auto-sync, themes, sounds, saved-index search, OCR payload, signing identity, and update flow are preserved."
          }
          JSON

      - name: Publish update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.10.9 (10091) Today and clean Photos'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify published update remotely
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED_COMMIT="$(git rev-parse HEAD)"
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/flutter-latest.json" -o /tmp/published-latest.json
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/Smart-Life-Flutter-Test.apk" -o /tmp/published.apk
          grep -q '"versionName": "0.10.9"' /tmp/published-latest.json
          grep -q '"versionCode": 10091' /tmp/published-latest.json
          test "$(sha256sum /tmp/published.apk | awk '{print $1}')" = 'eb27c3f5b95f7e3e7f0ca29a2a577ba30c8766dfac5535e1dff44e7ccdae97e5'
          echo 'Smart Life v0.10.9 update channel verified remotely.'
