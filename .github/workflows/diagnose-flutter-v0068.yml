name: Diagnose Smart Life v0.6.8 Smart Search

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-flutter-v0068.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current update channel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify current v0.6.8 APK
        shell: bash
        run: |
          set -euo pipefail
          test -f Smart-Life-Flutter-Test.apk
          sha256sum Smart-Life-Flutter-Test.apk | tee /tmp/apk-sha.txt
          grep -q '^a8f2ebd9ce602af4fe0f4cc8518f01dc80f6686ce1d8bcd75f0616e5cec8778b ' /tmp/apk-sha.txt

      - name: Download JADX
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 https://github.com/skylot/jadx/releases/download/v1.5.2/jadx-1.5.2.zip -o /tmp/jadx.zip
          rm -rf /tmp/jadx && mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --version

      - name: Decompile current APK
        shell: bash
        run: |
          set -u
          rm -rf /tmp/v068-decompiled
          /tmp/jadx/bin/jadx --deobf --show-bad-code --comments-level debug --no-res -d /tmp/v068-decompiled Smart-Life-Flutter-Test.apk || true
          test -d /tmp/v068-decompiled/sources

      - name: Collect Smart Search implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf diagnostics/v068-smart-search
          mkdir -p diagnostics/v068-smart-search/sources/app diagnostics/v068-smart-search/sources/selected

          for d in com/example/smart_life com/filesearch/app; do
            if [ -d "/tmp/v068-decompiled/sources/$d" ]; then
              cp -R "/tmp/v068-decompiled/sources/$d" "diagnostics/v068-smart-search/sources/app/$(echo "$d" | tr '/' '_')"
            fi
          done

          for f in om1.java nm1.java tm3.java ej3.java os1.java su0.java tu0.java uu0.java e61.java d61.java km1.java km0.java; do
            src="/tmp/v068-decompiled/sources/p000/$f"
            [ -f "$src" ] && cp "$src" diagnostics/v068-smart-search/sources/selected/ || true
          done

          grep -RlE 'indexSmartContent|searchSmartContent|content_index|TextRecognition|getClient\(|InputImage|smart_content|WhatsApp|Screenshot|screen.?shot' \
            /tmp/v068-decompiled/sources/p000 2>/dev/null | head -100 > /tmp/matches.txt || true
          while IFS= read -r src; do
            [ -f "$src" ] || continue
            cp "$src" "diagnostics/v068-smart-search/sources/selected/$(basename "$src")"
          done < /tmp/matches.txt

          {
            echo 'Smart Life v0.6.8 Smart Search diagnostic report'
            echo '================================================'
            echo
            echo 'APK SHA256:'; cat /tmp/apk-sha.txt
            echo
            echo 'Direct matching source files:'; cat /tmp/matches.txt || true
            echo
            echo 'All Smart Search / OCR references:'
            grep -RInE 'indexSmartContent|searchSmartContent|content_index|TextRecognition|TextRecognizer|InputImage|smart_content|WhatsApp|Screenshot|screen.?shot|image/jpeg|image/png' \
              /tmp/v068-decompiled/sources 2>/dev/null | head -3000 || true
          } > diagnostics/v068-smart-search/report.txt

          find diagnostics/v068-smart-search -type f -size +900k -delete

      - name: Publish diagnostic sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/v068-smart-search
          git diff --cached --quiet && exit 0
          git commit -m 'Capture Smart Search worker classes from v0.6.8'
          git pull --rebase origin main
          git push origin HEAD:main
