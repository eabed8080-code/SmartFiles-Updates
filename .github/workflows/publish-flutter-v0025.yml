name: Publish Smart Life Flutter Test v0.2.5

on:
  push:
    paths:
      - '.github/workflows/publish-flutter-v0025.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4

      - name: Download signed Flutter artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-a6dc-81f7-ad8d-10e215f4696b/raw?se=2026-09-02T23%3A37%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=444e68a9-5db1-526c-8fa7-0b22b37c0eff&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T22%3A43%3A32Z&ske=2026-09-03T22%3A43%3A32Z&sks=b&skv=2026-02-06&sig=aQeCV1khEAv0J9VuPLlW%2BGRyiBQ5DmzgHtAyLU5ia4E%3D' -o /tmp/flutter-v0025.zip
          rm -rf /tmp/flutter-v0025
          mkdir -p /tmp/flutter-v0025
          unzip -q /tmp/flutter-v0025.zip -d /tmp/flutter-v0025
          test -f /tmp/flutter-v0025/Smart-Life-Flutter-Test.apk
          cp /tmp/flutter-v0025/Smart-Life-Flutter-Test.apk Smart-Life-Flutter-Test.apk

      - name: Update Flutter feed
        shell: bash
        run: |
          cat > flutter-latest.json <<'EOF'
          {
            "versionName": "0.2.5",
            "versionCode": 7,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Flutter Photos, Converter, and Settings pages rebuilt and connected."
          }
          EOF

      - name: Publish Flutter update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life Flutter Test v0.2.5' || true
          git pull --rebase origin main
          git push
