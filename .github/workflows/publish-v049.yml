name: Publish Smart Files v0.49

on:
  push:
    paths:
      - ".github/workflows/publish-v049.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4

      - name: Download verified v0.49 APK artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://sdmntprwestus3.oaiusercontent.com/files/00000000-2b70-81fd-ba65-16a25cad4c9c/raw?se=2026-09-01T00%3A15%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=fc134f94-2e1c-52c2-ac57-c56461b37955&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T21%3A58%3A25Z&ske=2026-09-01T21%3A58%3A25Z&sks=b&skv=2026-02-06&sig=FlXRuyVkcH/XGBqQQPvH5oCOXmizPQ9rPP9pDVGYzqM%3D' \
            --output /tmp/v049.zip
          rm -rf /tmp/v049
          mkdir -p /tmp/v049
          unzip -q /tmp/v049.zip -d /tmp/v049
          test -f /tmp/v049/Smart-Files.apk
          echo '58d684ae6318f8b3221a66e9ee5a587f21a1abf94b49cc57391f86f184a2252b  /tmp/v049/Smart-Files.apk' | sha256sum -c -
          cp /tmp/v049/Smart-Files.apk ./Smart-Files.apk

      - name: Publish update feed
        shell: bash
        run: |
          set -euo pipefail
          cat > latest.json <<'JSON'
          {
            "versionName": "0.49",
            "versionCode": 51,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Files.apk",
            "releaseNotes": "Smart Files V0.49 adds a new offline Converter tab for length, weight, volume, area, temperature, storage and internet-speed conversions."
          }
          JSON

          git config user.name "Smart Files Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Smart-Files.apk latest.json
          git commit -m "Publish Smart Files v0.49 (51)"
          git push
