name: Publish Smart Life v0.11.5 Media

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0115-media.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4

      - name: Download verified v0.11.5 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-8760-81f5-a156-cc42bfaccc3e/raw?se=2026-09-11T06%3A09%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=9b6a7191-aa68-5f3b-816f-24c2a3c998b8&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-11T00%3A43%3A37Z&ske=2026-09-12T00%3A43%3A37Z&sks=b&skv=2026-02-06&sig=8Ql3NPFmrVFq/eVKZbfUco%2BIh5ctOmBW5cCsD45LyTk%3D' -o /tmp/v0115.zip
          rm -rf /tmp/v0115
          mkdir -p /tmp/v0115
          unzip -q /tmp/v0115.zip -d /tmp/v0115
          test -f /tmp/v0115/Smart-Life-v0.11.5-Media.apk
          test -f /tmp/v0115/release-version.json
          grep -q '"versionName":"0.11.5"' /tmp/v0115/release-version.json
          grep -q '"versionCode":10097' /tmp/v0115/release-version.json
          echo '627258d673137e4490b871892b62ce3a869391c7499059747984e20feca9da0c  /tmp/v0115/Smart-Life-v0.11.5-Media.apk' | sha256sum -c -
          cp /tmp/v0115/Smart-Life-v0.11.5-Media.apk Smart-Life-Flutter-Test.apk

      - name: Update Smart Life feed
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.11.5",
            "versionCode": 10097,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Photos is now Media with separate Photos and Videos views. Videos have their own Years grouping plus Newest, Oldest, Largest and Smallest sorting, with local thumbnails, duration and size details. Existing photo behavior and the v0.11.4 category icon system are preserved."
          }
          JSON

      - name: Publish v0.11.5 to update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.11.5 Media'
          git push
