name: Publish Smart Life v0.9.8 Arabic Index Writeback Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-flutter-v0098-arabic-index-writeback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify signed v0.9.8 artifact
        shell: bash
        env:
          SOURCE_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-0ce4-81fd-95cd-2dce65211dc5/raw?se=2026-09-08T19%3A58%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=9aa0b6f5-faf3-5e61-9e55-43051e9d3625&skoid=b9a47e8b-72a2-4ed3-8028-a2a98c1a6142&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-08T19%3A16%3A52Z&ske=2026-09-09T19%3A16%3A52Z&sks=b&skv=2026-02-06&sig=/7HuAUXYQhMneIxjwU1AjhLzbukA4YDlULxSokjvhM4%3D'
          EXPECTED_SHA256: '89eb7c3a672128fec924a0df4dcafc4b8f4bffbd63a9fd49b77afb6b2eda7dab'
        run: |
          set -euo pipefail
          rm -rf incoming-v098
          mkdir incoming-v098
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o incoming-v098/artifact.zip
          unzip -q incoming-v098/artifact.zip -d incoming-v098/unpacked
          APK="$(find incoming-v098/unpacked -type f -name 'Smart-Life-v0.9.8-Arabic-Index-Writeback.apk' -print -quit)"
          test -n "$APK"
          ACTUAL_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "APK SHA256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          SIZE="$(stat -c %s "$APK")"
          echo "APK bytes: $SIZE"
          test "$SIZE" -lt 104857600
          cp "$APK" Smart-Life-Flutter-Test.apk

      - name: Verify APK identity and OCR payload
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          CERT="$($TOOLS/apksigner verify --verbose --print-certs Smart-Life-Flutter-Test.apk)"
          printf '%s' "$CERT" | tr '[:upper:]' '[:lower:]' | tr -d ': ' | grep -q 'fba1a652ac3ed950b45ea26585cccbeb8497153f137f761d17ea12cae71c955b'
          BADGING="$("$TOOLS/aapt" dump badging Smart-Life-Flutter-Test.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionName='0.9.8'"
          echo "$BADGING" | grep -q "versionCode='10080'"
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'assets/tessdata/ara.traineddata'
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'assets/tessdata/eng.traineddata'
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'assets/models/rec/inference.onnx'
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'assets/models/det/inference.onnx'
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'lib/arm64-v8a/libtesseract.so'
          unzip -l Smart-Life-Flutter-Test.apk | grep -q 'lib/arm64-v8a/libonnxruntime.so'

      - name: Write v0.9.8 update metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.9.8",
            "versionCode": 10080,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Arabic index writeback repair. The one-file diagnostic proved the exact original PDF can read ‘عبد الرحيم’ with Tesseract on Android. v0.9.8 now makes Arabic Rescue use the same 2000px Tesseract-quality path before merging OCR text into the existing Smart Search row. A new arabic_repair_v3 checkpoint generation retries files previously attempted at lower resolution, up to 48 candidates per Arabic search, and future scanned PDF/image OCR also uses the 2000px quality floor. The completed main index is preserved; no rebuild or clear is performed."
          }
          JSON

      - name: Publish to Smart Life update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.9.8 (10080) Arabic index writeback repair'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify published metadata and APK remotely
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED_COMMIT="$(git rev-parse HEAD)"
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/flutter-latest.json" -o /tmp/published-latest.json
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/Smart-Life-Flutter-Test.apk" -o /tmp/published.apk
          grep -q '"versionName": "0.9.8"' /tmp/published-latest.json
          grep -q '"versionCode": 10080' /tmp/published-latest.json
          test "$(sha256sum /tmp/published.apk | awk '{print $1}')" = '89eb7c3a672128fec924a0df4dcafc4b8f4bffbd63a9fd49b77afb6b2eda7dab'
          echo 'Smart Life v0.9.8 update channel verified remotely.'
