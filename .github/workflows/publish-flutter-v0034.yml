name: Publish Smart Life v0.3.4

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-flutter-v0034.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4

      - name: Download signed Flutter artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-8eac-81f7-8e82-9e193dc76994/raw?se=2026-09-03T07%3A26%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=f2da85c2-d6e0-5162-89b5-1b1b05daf2c4&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T21%3A35%3A05Z&ske=2026-09-03T21%3A35%3A05Z&sks=b&skv=2026-02-06&sig=al6uGTXpZINAgpHcFeUYuXaNfOPWetSVOQHBlEeVit0%3D' -o /tmp/flutter-v0034.zip
          rm -rf /tmp/flutter-v0034
          mkdir -p /tmp/flutter-v0034
          unzip -q /tmp/flutter-v0034.zip -d /tmp/flutter-v0034
          test -f /tmp/flutter-v0034/Smart-Life-Flutter-Test.apk
          cp /tmp/flutter-v0034/Smart-Life-Flutter-Test.apk Smart-Life-Flutter-Test.apk

      - name: Update Flutter feed
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.3.4",
            "versionCode": 16,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Scanner reliability fix: Google ML Kit remains the preferred scanner, but if Google Play services fails while creating the scanner client, Smart Life now automatically opens its own local Camera2 document scanner instead of showing the NullPointerException error. The fallback reuses the proven native Smart Life camera and local document cleanup code and keeps scans on the phone."
          }
          JSON

      - name: Publish Flutter update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Smart Life Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life Flutter v0.3.4' || true
          git pull --rebase origin main
          git push origin main
