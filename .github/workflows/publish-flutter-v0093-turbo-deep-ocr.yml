name: Publish Smart Life v0.9.3 Turbo Deep OCR

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-flutter-v0093-turbo-deep-ocr.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify signed v0.9.3 artifact
        shell: bash
        env:
          SOURCE_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-8ccc-81fd-9e02-5e49ca0f81f6/raw?se=2026-09-08T02%3A44%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=49f59a9d-7bf7-5404-aab1-81110d290bff&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-07T11%3A45%3A13Z&ske=2026-09-08T11%3A45%3A13Z&sks=b&skv=2026-02-06&sig=6yEIrn68chwel89AUbOi15mMQoAo5cq8Uj%2Bgbz1HUjk%3D'
          EXPECTED_SHA256: '0e16a26909d6a236bef51db167d751316a35a6c947875050c806497f801498ce'
        run: |
          set -euo pipefail
          rm -rf incoming-v093
          mkdir incoming-v093
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o incoming-v093/artifact.zip
          unzip -q incoming-v093/artifact.zip -d incoming-v093/unpacked
          APK="$(find incoming-v093/unpacked -type f -name 'Smart-Life-v0.9.3-Turbo-Deep-OCR.apk' -print -quit)"
          test -n "$APK"
          ACTUAL_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "APK SHA256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          cp "$APK" Smart-Life-Flutter-Test.apk

      - name: Verify APK identity before publish
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          CERT="$($TOOLS/apksigner verify --verbose --print-certs Smart-Life-Flutter-Test.apk)"
          printf '%s' "$CERT" | tr '[:upper:]' '[:lower:]' | tr -d ': ' | grep -q 'fba1a652ac3ed950b45ea26585cccbeb8497153f137f761d17ea12cae71c955b'
          BADGING="$("$TOOLS/aapt" dump badging Smart-Life-Flutter-Test.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionName='0.9.3'"
          echo "$BADGING" | grep -q "versionCode='10075'"

      - name: Write v0.9.3 update metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.9.3",
            "versionCode": 10075,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Turbo Deep OCR speeds up the remaining Smart Search work without rebuilding or discarding completed index progress. The deep stage no longer repeats the image document probe or PDF embedded-text extraction already completed by the fast stage. OCR working images are reduced to a practical document-reading size, idle pauses between micro-batches are shortened, and capable 8+ core phones can process up to three OCR files at a time while 6-7 core devices use two and smaller devices remain sequential. PaddleOCR stays limited to two inference threads per call to avoid excessive CPU pressure. SQLite checkpoints, Pause/Resume, unchanged-file reuse, Search by Name, Search Content, Connect to PC, Transfer Status, reminders, sounds, and previous Smart Life behavior are preserved."
          }
          JSON

      - name: Publish to Smart Life update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.9.3 (10075) Turbo Deep OCR'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify published metadata and APK remotely
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED_COMMIT="$(git rev-parse HEAD)"
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/flutter-latest.json" -o /tmp/published-latest.json
          curl -fL --retry 3 "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/${PUBLISHED_COMMIT}/Smart-Life-Flutter-Test.apk" -o /tmp/published.apk
          grep -q '"versionName": "0.9.3"' /tmp/published-latest.json
          grep -q '"versionCode": 10075' /tmp/published-latest.json
          test "$(sha256sum /tmp/published.apk | awk '{print $1}')" = '0e16a26909d6a236bef51db167d751316a35a6c947875050c806497f801498ce'
          echo 'Smart Life v0.9.3 update channel verified remotely.'
