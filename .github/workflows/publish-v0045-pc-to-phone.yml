name: Publish Smart Life v0.4.5 PC to Phone

on:
  push:
    paths:
      - '.github/workflows/publish-v0045-pc-to-phone.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      APK_ARTIFACT_URL: 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-2ac0-81f7-bba0-7d0f8b32df00/raw?se=2026-09-03T22%3A54%3A10Z&sp=r&sv=2026-02-06&sr=b&scid=f36fc271-4d4f-5eba-9e42-1238df024637&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-03T19%3A24%3A37Z&ske=2026-09-04T19%3A24%3A37Z&sks=b&skv=2026-02-06&sig=5Xz4eYPV%2BZjIjz2fkYnD6rlDtxffxt9WdDS1Mjo9qQU%3D'
      PC_ARTIFACT_URL: 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-96d8-81f7-8354-181f84c305c9/raw?se=2026-09-03T22%3A54%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=e87d0ae7-bde9-539f-9be9-6efdfbc6d5ee&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-03T19%3A26%3A39Z&ske=2026-09-04T19%3A26%3A39Z&sks=b&skv=2026-02-06&sig=4rGhtxUUPgXjcPv8TiVv22iiQrb0Pu42KPlvWVfPFGc%3D'
    steps:
      - name: Checkout updates repo
        uses: actions/checkout@v4

      - name: Download signed Flutter APK artifact
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$APK_ARTIFACT_URL" -o /tmp/flutter.zip
          rm -rf /tmp/flutter
          mkdir -p /tmp/flutter
          unzip -q /tmp/flutter.zip -d /tmp/flutter
          APK="$(find /tmp/flutter -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" Smart-Life-Flutter-Test.apk

      - name: Download Windows receiver package
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$PC_ARTIFACT_URL" -o Smart-Life-PC-Receiver.zip
          unzip -tq Smart-Life-PC-Receiver.zip >/dev/null

      - name: Update Flutter feed
        run: |
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.4.5",
            "versionCode": 2027,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "PC to phone transfer phase 2: keep Smart Life open on the phone, then use the PC Receiver to browse or drag and drop files and send them to the phone. Received files are saved in Downloads/Smart Life. Phone and computer must be on the same local network."
          }
          JSON

      - name: Publish phone update and PC receiver package
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Smart-Life-Flutter-Test.apk Smart-Life-PC-Receiver.zip flutter-latest.json
          git commit -m "Publish Smart Life v0.4.5 build 2027"
          git push
