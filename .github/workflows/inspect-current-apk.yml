name: Inspect current Smart Life APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-current-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Inspect APK launcher class and signing readiness
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK='Smart-Life-Flutter-Test.apk'
          test -f "$APK"
          rm -rf /tmp/smartlife-apk
          mkdir -p /tmp/smartlife-apk
          unzip -q "$APK" -d /tmp/smartlife-apk
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"

          {
            echo 'Smart Life launcher / signing inspection'
            echo '========================================'
            echo
            echo "APK SHA256: $(sha256sum "$APK" | awk '{print $1}')"
            echo "Badging: $("$TOOLS/aapt" dump badging "$APK" | head -n 1)"
            echo
            echo 'Signing secret readiness (values are NOT printed):'
            for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
              if [ -n "${!v:-}" ]; then echo "$v=SET"; else echo "$v=UNSET"; fi
            done
            echo
            echo 'MainActivity dex declaration:'
            found=0
            for dex in /tmp/smartlife-apk/classes*.dex; do
              if "$TOOLS/dexdump" -d "$dex" 2>/dev/null | grep -q 'Class descriptor.*Lcom/example/smart_life/MainActivity;'; then
                found=1
                "$TOOLS/dexdump" -d "$dex" 2>/dev/null | awk '
                  /Class descriptor.*Lcom\/example\/smart_life\/MainActivity;/ {p=1}
                  p {print}
                  p && /source_file_idx/ {exit}
                ' | head -n 450
                echo "MainActivityDex=$(basename "$dex")"
                break
              fi
            done
            echo "MainActivityFound=$found"
            echo
            echo 'Relevant class names in DEX:'
            find /tmp/smartlife-apk -maxdepth 1 -type f -name 'classes*.dex' -print0 | xargs -0 -r strings -a | grep -E 'com/example/smart_life/(MainActivity|PcShareActivity|TaskReminderReceiver)|Opening|Splash' | sort -u | head -n 200 || true
          } > current-launcher-inspection.txt

      - name: Commit inspection result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Smart Life Inspection Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add current-launcher-inspection.txt
          git commit -m 'Inspect Smart Life launcher and signing readiness' || true
          git pull --rebase origin main
          git push origin main
