name: Publish Smart Life v0.55

on:
  push:
    paths:
      - '.github/workflows/publish-v055.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4

      - name: Download signed v0.55 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-182c-81f7-9da0-63bce077d746/raw?se=2026-09-01T16%3A22%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=8d87ff3b-2eec-5be3-b896-e85a3faac1fb&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-01T12%3A56%3A57Z&ske=2026-09-02T12%3A56%3A57Z&sks=b&skv=2026-02-06&sig=xSkLCNQARRw7qLoYBNNa9LvsHsJo/hAXMexrGfBiRRM%3D' -o /tmp/v055-artifact.zip
          rm -rf /tmp/v055
          mkdir -p /tmp/v055
          unzip -q /tmp/v055-artifact.zip -d /tmp/v055
          test -f /tmp/v055/dist/Smart-Life.apk
          cp /tmp/v055/dist/Smart-Life.apk Smart-Files.apk
          sha256sum Smart-Files.apk

      - name: Update feed
        shell: bash
        run: |
          cat > latest.json <<'EOF'
          {
            "versionName": "0.55",
            "versionCode": 57,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Files.apk",
            "releaseNotes": "Smart Life V0.55 refreshes the interface with a brighter File Manager-inspired light blue theme, replaces text-symbol icons with real graphical icons across file types, Documents, Quick Access and bottom navigation, and adds an in-app Back button with navigation history so internal pages can return without exiting the app. Night Mode remains available in Settings."
          }
          EOF

      - name: Publish update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart-Files.apk latest.json
          git commit -m 'Publish Smart Life v0.55' || true
          git pull --rebase origin main
          git push
