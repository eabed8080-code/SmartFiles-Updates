name: Publish Smart Life v0.4.7 WhatsApp Recipient Fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0046-whatsapp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4

      - name: Download signed Smart Life v0.4.7 APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-163c-81f7-a46e-281863d3db28/raw?se=2026-09-04T02%3A07%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=a1f54a77-b96b-5da7-8fdc-55c5b34e499e&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T01%3A43%3A20Z&ske=2026-09-05T01%3A43%3A20Z&sks=b&skv=2026-02-06&sig=qYnrnNp1Jz2YZBZj7JUoqLrVl%2BiP8HdsHqe9FVHQNqw%3D' -o /tmp/smart-life-v0047.zip
          rm -rf /tmp/smart-life-v0047
          mkdir -p /tmp/smart-life-v0047
          unzip -q /tmp/smart-life-v0047.zip -d /tmp/smart-life-v0047
          test -f /tmp/smart-life-v0047/Smart-Life-Flutter-Test.apk
          test "$(stat -c%s /tmp/smart-life-v0047/Smart-Life-Flutter-Test.apk)" -lt 100000000
          cp /tmp/smart-life-v0047/Smart-Life-Flutter-Test.apk Smart-Life-Flutter-Test.apk
          ls -lh Smart-Life-Flutter-Test.apk

      - name: Update Smart Life feed
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.4.7",
            "versionCode": 6029,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "WhatsApp recipient fix: the direct WhatsApp button now hands the selected file to WhatsApp's recipient picker so the file is ready to send to a person or group. This build also corrects the Android version-code packaging so in-app updates are detected correctly."
          }
          JSON

      - name: Publish updater APK and feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Smart Life Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.4.7 build 6029' || true
          git pull --rebase origin main
          git push origin main
