name: Publish Smart Life v0.4.7 WhatsApp Recipient Fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0046-whatsapp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4

      - name: Download signed Smart Life v0.4.7 APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-d158-81f5-8a23-4373c4c04beb/raw?se=2026-09-04T01%3A18%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=347c0f65-538c-590e-940c-cd620d93c45b&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-03T23%3A48%3A33Z&ske=2026-09-04T23%3A48%3A33Z&sks=b&skv=2026-02-06&sig=tBgnPzv2NowHzawfe56RhltCy6vKf9w1E9SeUq2HMwY%3D' -o /tmp/smart-life-v0047.zip
          rm -rf /tmp/smart-life-v0047
          mkdir -p /tmp/smart-life-v0047
          unzip -q /tmp/smart-life-v0047.zip -d /tmp/smart-life-v0047
          test -f /tmp/smart-life-v0047/Smart-Life-Flutter-Test.apk
          test "$(stat -c%s /tmp/smart-life-v0047/Smart-Life-Flutter-Test.apk)" -lt 100000000
          cp /tmp/smart-life-v0047/Smart-Life-Flutter-Test.apk Smart-Life-Flutter-Test.apk
          ls -lh Smart-Life-Flutter-Test.apk

      - name: Update Smart Life feed
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.4.7",
            "versionCode": 4029,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "WhatsApp recipient fix: the direct WhatsApp button now hands the selected file to WhatsApp's recipient picker so the file is ready to send to a person or group."
          }
          JSON

      - name: Publish updater APK and feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Smart Life Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life v0.4.7 build 4029' || true
          git pull --rebase origin main
          git push origin main
