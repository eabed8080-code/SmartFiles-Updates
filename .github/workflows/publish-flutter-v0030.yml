name: Publish Smart Life v0.3.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-flutter-v0030.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v4

      - name: Download signed Flutter artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-1180-81f7-a58f-1589486c01d3/raw?se=2026-09-03T02%3A39%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=5c957886-3b8b-57c8-8fc6-8bbf95309abf&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T21%3A35%3A05Z&ske=2026-09-03T21%3A35%3A05Z&sks=b&skv=2026-02-06&sig=7JCvg5DrWIkkiCq7WXIzY3rpoqNlEc8XpKkOwANefNY%3D' -o /tmp/flutter-v0030.zip
          rm -rf /tmp/flutter-v0030
          mkdir -p /tmp/flutter-v0030
          unzip -q /tmp/flutter-v0030.zip -d /tmp/flutter-v0030
          test -f /tmp/flutter-v0030/Smart-Life-Flutter-Test.apk
          cp /tmp/flutter-v0030/Smart-Life-Flutter-Test.apk Smart-Life-Flutter-Test.apk

      - name: Update Flutter feed
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter-latest.json <<'JSON'
          {
            "versionName": "0.3.0",
            "versionCode": 12,
            "apkUrl": "https://raw.githubusercontent.com/eabed8080-code/SmartFiles-Updates/main/Smart-Life-Flutter-Test.apk",
            "releaseNotes": "Fixes Google document scanner launching, applies selected color themes across the whole app, shows PowerPoint fully, enlarges and colors the bottom navigation, adds subtle tap animations, and removes the File Types selection border."
          }
          JSON

      - name: Publish Flutter update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Smart Life Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Smart-Life-Flutter-Test.apk flutter-latest.json
          git commit -m 'Publish Smart Life Flutter v0.3.0' || true
          git pull --rebase origin main
          git push origin main
